name: Apply Shutdown Gate

on:
  push:
    branches:
      - milestone-7-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply shutdown gate
        shell: pwsh
        run: |
          python .github/scripts/milestone7_shutdown_gate.py
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          git diff --check

      - name: Commit shutdown gate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone7-shutdown-gate.yml
          git rm .github/scripts/milestone7_shutdown_gate.py
          git add src/command.rs tests/shutdown_gate.rs
          git diff --cached --name-status
          git commit -m "reject queued work during shutdown"
          git push origin HEAD:milestone-7-hardening
