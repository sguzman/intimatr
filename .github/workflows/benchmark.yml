name: Scanner Benchmarks

on:
  push:
    branches:
      - milestone-7-hardening
    paths:
      - Cargo.toml
      - benches/**
      - src/scanner/**
      - src/analysis.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run large-scan benchmarks
        run: cargo bench --bench scanner -- --quick --noplot

      - name: Upload Criterion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-benchmark-report
          path: target/criterion
          if-no-files-found: ignore
