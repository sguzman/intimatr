name: HUD shell safety

on:
  push:
    paths:
      - 'scripts/bottles-hud.sh'
      - 'scripts/test-bottles-hud.sh'
      - 'scripts/bottles-setup.sh'
      - 'scripts/test-bottles-setup.sh'
      - 'scripts/bottles-setup-recover.sh'
      - 'scripts/bottles-discover.sh'
      - 'scripts/test-bottles-discover.sh'
      - 'scripts/bottles-launch.sh'
      - 'scripts/test-bottles-launch.sh'
      - 'scripts/bottles-managed-launch.sh'
      - 'scripts/bottles-qa-preflight.sh'
      - 'scripts/bottles-qa-session.sh'
      - 'scripts/test-bottles-managed-launch.sh'
      - 'scripts/bottles-profiles-batch.sh'
      - 'scripts/test-bottles-profiles-batch.sh'
      - 'scripts/bottles-full-setup.sh'
      - 'scripts/test-bottles-full-setup.sh'
      - 'scripts/bottles-full-recover.sh'
      - 'scripts/bottles-shortcut.sh'
      - 'scripts/bottles-multi-game.sh'
      - 'scripts/test-bottles-multi-game.sh'
      - '.github/workflows/hud-shell.yml'
  pull_request:
    paths:
      - 'scripts/bottles-hud.sh'
      - 'scripts/test-bottles-hud.sh'
      - 'scripts/bottles-setup.sh'
      - 'scripts/test-bottles-setup.sh'
      - 'scripts/bottles-setup-recover.sh'
      - 'scripts/bottles-discover.sh'
      - 'scripts/test-bottles-discover.sh'
      - 'scripts/bottles-launch.sh'
      - 'scripts/test-bottles-launch.sh'
      - 'scripts/bottles-managed-launch.sh'
      - 'scripts/bottles-qa-preflight.sh'
      - 'scripts/bottles-qa-session.sh'
      - 'scripts/test-bottles-managed-launch.sh'
      - 'scripts/bottles-profiles-batch.sh'
      - 'scripts/test-bottles-profiles-batch.sh'
      - 'scripts/bottles-full-setup.sh'
      - 'scripts/test-bottles-full-setup.sh'
      - 'scripts/bottles-full-recover.sh'
      - 'scripts/bottles-shortcut.sh'
      - 'scripts/bottles-multi-game.sh'
      - 'scripts/test-bottles-multi-game.sh'
      - '.github/workflows/hud-shell.yml'

permissions:
  contents: read

jobs:
  hud-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bash syntax and isolated HUD rollback
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          command -v sha256sum
          bash -n scripts/bottles-hud.sh
          bash -n scripts/test-bottles-hud.sh
          bash scripts/test-bottles-hud.sh
          bash -n scripts/bottles-setup.sh
          bash -n scripts/bottles-setup-recover.sh
          bash -n scripts/test-bottles-setup.sh
          bash scripts/test-bottles-setup.sh
          bash -n scripts/bottles-multi-game.sh
          bash -n scripts/test-bottles-multi-game.sh
          bash scripts/test-bottles-multi-game.sh
          bash -n scripts/bottles-discover.sh
          bash -n scripts/test-bottles-discover.sh
          bash scripts/test-bottles-discover.sh
          bash -n scripts/bottles-launch.sh
          bash -n scripts/test-bottles-launch.sh
          bash scripts/test-bottles-launch.sh
          bash -n scripts/bottles-managed-launch.sh
          bash -n scripts/bottles-qa-preflight.sh
          bash -n scripts/bottles-qa-session.sh
          bash -n scripts/test-bottles-managed-launch.sh
          bash -n scripts/bottles-shortcut.sh
          bash scripts/test-bottles-managed-launch.sh
          bash -n scripts/bottles-profiles-batch.sh
          bash -n scripts/test-bottles-profiles-batch.sh
          bash scripts/test-bottles-profiles-batch.sh
          bash -n scripts/bottles-full-setup.sh
          bash -n scripts/test-bottles-full-setup.sh
          bash -n scripts/bottles-full-recover.sh
          bash scripts/test-bottles-full-setup.sh
