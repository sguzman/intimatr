name: Check CONTEXT Layout

on:
  push:
    branches:
      - milestone-5-debugger

permissions:
  contents: read

jobs:
  layout:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Print CONTEXT ABI layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force examples | Out-Null
          @'
          use std::mem::{align_of, size_of};
          use windows_sys::Win32::System::Diagnostics::Debug::{
              CONTEXT, CONTEXT_ALL_AMD64, CONTEXT_CONTROL_AMD64,
              CONTEXT_DEBUG_REGISTERS_AMD64,
          };

          fn main() {
              println!("CONTEXT size={} align={}", size_of::<CONTEXT>(), align_of::<CONTEXT>());
              println!("CONTEXT_ALL_AMD64=0x{CONTEXT_ALL_AMD64:08X}");
              println!("CONTEXT_CONTROL_AMD64=0x{CONTEXT_CONTROL_AMD64:08X}");
              println!("CONTEXT_DEBUG_REGISTERS_AMD64=0x{CONTEXT_DEBUG_REGISTERS_AMD64:08X}");
          }
          '@ | Set-Content examples/context_layout.rs
          cargo run --example context_layout
