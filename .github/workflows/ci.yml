          # must not be substituted for this selected exact game's rules.
          cat >"$WINEPREFIX/drive_c/intimatr-ci-wrong-speed.toml" <<'WRONG_GAME_PROFILE'
          version = 1
          [speed]
          enabled = true
          initial_multiplier = 1.5
          WRONG_GAME_PROFILE
          if target/release/intimatr-bottles profile-launch \
              --config "$(pwd)/target/wine-attach/host-speed-rules.toml" \
              --bottle Fixture --exe "$game_fixture_windows" \
              --program 'Selected standalone offline test fixture' \
              --profile "$WINEPREFIX/drive_c/intimatr-ci-wrong-speed.toml" \
              --bottles-cli target/wine-attach/mocks/bottles-cli \
              --offline-single-player --launch \
              >target/wine-attach/launch-wrong-profile.stdout 2>target/wine-attach/launch-wrong-profile.stderr; then
            echo "ERROR: profile-launch accepted an unrelated valid game profile" >&2
            exit 1
          fi
          grep -q 'launch profile differs from the selected game policy' target/wine-attach/launch-wrong-profile.stderr
          test ! -e "$INTIMATR_MOCK_LAUNCH_RECEIPT"
          # An ambiguous native registered-program name must fail closed
          # even if both entries happen to reference the selected image.
          jq -n --arg path "$game_fixture_windows" '[
            {"name":"Selected standalone offline test fixture","executable":"wine-attach-target.exe","path":$path},
            {"name":"Selected standalone offline test fixture","executable":"wine-attach-target.exe","path":$path}
          ]' >target/wine-attach/mocks/duplicate-launch-programs.json
          if INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/duplicate-launch-programs.json" \
              target/release/intimatr-bottles profile-launch "${launch_args[@]}" \
              >target/wine-attach/launch-duplicate-name.stdout 2>target/wine-attach/launch-duplicate-name.stderr; then
            echo "ERROR: profile-launch accepted an ambiguous registered program" >&2
            exit 1
          fi
          grep -q 'selected program name is absent or ambiguous' target/wine-attach/launch-duplicate-name.stderr
          test ! -e "$INTIMATR_MOCK_LAUNCH_RECEIPT"
          # Reject host-profile inheritance that Bottles would filter.
          # A refused launch must not create a mock run receipt.
          jq -n '{"Fixture":{"Limit_System_Environment":true,"Environment_Variables":{},"Inherited_Environment_Variables":["PATH"]}}' >target/wine-attach/mocks/filtered-env.json
          if INTIMATR_MOCK_BOTTLES_JSON="$(pwd)/target/wine-attach/mocks/filtered-env.json" target/release/intimatr-bottles profile-launch "${launch_args[@]}" >target/wine-attach/launch-filtered.stdout 2>target/wine-attach/launch-filtered.stderr; then
            echo "ERROR: profile-launch ignored a filtered inherited environment" >&2
            exit 1
          fi
          grep -q 'must allowlist INTIMATR_SPEED_PROFILE' target/wine-attach/launch-filtered.stderr
          test ! -e "$INTIMATR_MOCK_LAUNCH_RECEIPT"
          jq -n '{"Fixture":{"Limit_System_Environment":true,"Inherited_Environment_Variables":["INTIMATR_SPEED_PROFILE"],"Environment_Variables":{"INTIMATR_SPEED_PROFILE":"C:\\wrong.toml"}}}' >target/wine-attach/mocks/override-env.json
          if INTIMATR_MOCK_BOTTLES_JSON="$(pwd)/target/wine-attach/mocks/override-env.json" target/release/intimatr-bottles profile-launch "${launch_args[@]}" >target/wine-attach/launch-overridden.stdout 2>target/wine-attach/launch-overridden.stderr; then
            echo "ERROR: profile-launch ignored a bottle-level profile override" >&2
            exit 1
          fi
          grep -q 'explicitly overrides INTIMATR_SPEED_PROFILE' target/wine-attach/launch-overridden.stderr
