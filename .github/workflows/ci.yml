            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/duplicate.stdout 2> target/wine-attach/duplicate.stderr; then
            echo "ERROR: duplicate attach was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q "refusing duplicate attach" target/wine-attach/duplicate.stderr
          echo "Wine test fixture rejected a second attach while running"
          touch target/wine-attach/attach-release.flag
          wait "$launcher_pid"
          trap - EXIT

