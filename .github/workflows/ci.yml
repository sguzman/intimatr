          target/release/intimatr-bottles profile-launch "${launch_args[@]}" \
            >target/wine-attach/profile-launch-report.json &
          game_launcher=$!
          trap 'kill "$game_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/game-fixture/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/game-fixture/attach-target.pid
