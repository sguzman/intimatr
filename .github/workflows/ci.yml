          # A registered-program launch uses the same exact full image policy
          # and the verified exported profile; this mock confirms what the
          # Bottles CLI receives, not what a real game receives.
          jq -n --arg path "$game_fixture_windows" '[{
            "name":"Selected standalone offline test fixture",
            "executable":"wine-attach-target.exe",
            "path":$path
          }]' >target/wine-attach/mocks/prelaunch-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/prelaunch-programs.json"
          export INTIMATR_MOCK_LAUNCH_RECEIPT="$(pwd)/target/wine-attach/bottles-launch-env.receipt"
          launch_args=(
            --config "$(pwd)/target/wine-attach/host-speed-rules.toml"
            --bottle Fixture --exe "$game_fixture_windows"
            --program 'Selected standalone offline test fixture'
            --profile "$WINEPREFIX/drive_c/intimatr-ci-speed.toml"
            --bottles-cli target/wine-attach/mocks/bottles-cli
            --offline-single-player --launch
