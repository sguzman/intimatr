name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build x86_64 Windows DLL and isolated timer probe
        run: cargo build --locked --release --lib --bin wine-load-probe --bin intimatr-speed --target x86_64-pc-windows-msvc

      - name: Verify DLL artifact
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/intimatr.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "Expected DLL artifact was not produced: $dll"
          }
          $item = Get-Item $dll
          if ($item.Length -le 0) {
            throw "DLL artifact is empty: $dll"
          }
          Write-Host "Verified $dll ($($item.Length) bytes)"

      - name: Verify Windows speed RPC client executable
        shell: pwsh
        run: |
          $client = "target/x86_64-pc-windows-msvc/release/intimatr-speed.exe"
          if (-not (Test-Path $client -PathType Leaf)) {
            throw "Missing Windows speed RPC client executable: $client"
          }
          if ((Get-Item $client).Length -le 0) {
            throw "Windows speed RPC client is empty: $client"
          }
          Write-Host "Verified $client"

      - name: Run native Windows four-timer and rollback smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "target/x86_64-pc-windows-msvc/release"
          $destination = "target/windows-smoke"
          New-Item -ItemType Directory -Force "$destination/config" | Out-Null
          Copy-Item "$source/intimatr.dll" "$destination/intimatr.dll"
          Copy-Item "$source/wine-load-probe.exe" "$destination/wine-load-probe.exe"
          Copy-Item "$source/intimatr-speed.exe" "$destination/intimatr-speed.exe"
          Copy-Item "config/wine-load-probe.exe.toml" "$destination/config/wine-load-probe.exe.toml"
          Push-Location $destination
          try {
            & ./wine-load-probe.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Native Windows isolated timer smoke failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Package and verify release layout
        shell: pwsh
        run: |
          $version = "ci-${{ github.run_number }}"
          $zip = & ./scripts/package-release.ps1 -Version $version
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "Packaging smoke test did not produce an archive: $zip"
          }
          & ./scripts/verify-release.ps1 -ArchivePath $zip -ExpectedVersion $version | Out-Null
          Write-Host "Verified release package $zip"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr.dll
          if-no-files-found: error



      - name: Upload Windows speed RPC client
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-speed-windows-msvc-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr-speed.exe
          if-no-files-found: error

  # Disposable Wine prefix, no personal Bottles state or game executables.
  wine-load-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install compiler and Wine runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64 wine xvfb

      - name: Cross-build DLL and Windows probes on Linux
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --lib --bin wine-load-probe --bin wine-attach-helper --bin wine-game-attach-helper --bin wine-attach-target --bin wine-process-list --bin intimatr-speed

      - name: Build native Linux test orchestration CLI
        run: cargo build --locked --release --bin intimatr-bottles

      - name: Run isolated Wine DLL load and shutdown smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-smoke/config
          cp target/x86_64-pc-windows-gnu/release/intimatr.dll target/wine-smoke/
          cp target/x86_64-pc-windows-gnu/release/wine-load-probe.exe target/wine-smoke/
          cp target/x86_64-pc-windows-gnu/release/intimatr-speed.exe target/wine-smoke/
          cp config/wine-load-probe.exe.toml target/wine-smoke/config/
          export WINEPREFIX="$RUNNER_TEMP/intimatr-wine-smoke"
          export WINEARCH=win64
          export WINEDEBUG=-all
          xvfb-run -a wine target/wine-smoke/wine-load-probe.exe

      - name: Exercise native Linux speed manager against hooked Wine fixture
        shell: bash
        run: xvfb-run -a bash scripts/wine-speed-bridge-smoke.sh

      - name: Verify independent Wine prefix process namespaces
        shell: bash
        run: |
          set -euo pipefail
          # Two independent, disposable Wine sessions. The host process
          # inventory must not accidentally return a target from another
          # WINEPREFIX even when the executable basename is identical.
          mkdir -p target/wine-namespace/a target/wine-namespace/b
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-namespace/a/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-namespace/b/
          cp target/x86_64-pc-windows-gnu/release/wine-process-list.exe target/wine-namespace/
          prefix_a="$RUNNER_TEMP/namespace-a"
          prefix_b="$RUNNER_TEMP/namespace-b"
          mkdir -p "$prefix_a" "$prefix_b"
          # Initialize prefixes before launching the short-lived fixtures.
          WINEARCH=win64 WINEDEBUG=-all WINEPREFIX="$prefix_a" xvfb-run -a wineboot -u >/dev/null 2>&1
          WINEARCH=win64 WINEDEBUG=-all WINEPREFIX="$prefix_b" xvfb-run -a wineboot -u >/dev/null 2>&1
          WINEDEBUG=-all WINEPREFIX="$prefix_a" xvfb-run -a wine target/wine-namespace/a/wine-attach-target.exe >target/wine-namespace/a/stdout 2>target/wine-namespace/a/stderr &
          launcher_a=$!
          WINEDEBUG=-all WINEPREFIX="$prefix_b" xvfb-run -a wine target/wine-namespace/b/wine-attach-target.exe >target/wine-namespace/b/stdout 2>target/wine-namespace/b/stderr &
          launcher_b=$!
          trap 'kill "$launcher_a" "$launcher_b" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-namespace/a/attach-target.pid && test -s target/wine-namespace/b/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-namespace/a/attach-target.pid
          test -s target/wine-namespace/b/attach-target.pid
          pid_a="$(cat target/wine-namespace/a/attach-target.pid)"
          pid_b="$(cat target/wine-namespace/b/attach-target.pid)"
          target/release/intimatr-bottles win-processes --prefix "$prefix_a" --helper target/wine-namespace/wine-process-list.exe --runner "$(command -v wine)" > target/wine-namespace/a.json
          target/release/intimatr-bottles win-processes --prefix "$prefix_b" --helper target/wine-namespace/wine-process-list.exe --runner "$(command -v wine)" > target/wine-namespace/b.json
          # Full image paths distinguish identical basenames across prefixes;
          # numerical Windows PIDs can collide between independent sessions.
          image_a="$(jq -r --argjson pid "$pid_a" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-namespace/a.json)"
          image_b="$(jq -r --argjson pid "$pid_b" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-namespace/b.json)"
          test -n "$image_a" && test -n "$image_b" && test "$image_a" != "$image_b"
          jq -e --arg path "$image_a" '([.processes[] | select(.full_image_path == $path)] | length) == 0' target/wine-namespace/b.json > /dev/null
          jq -e --arg path "$image_b" '([.processes[] | select(.full_image_path == $path)] | length) == 0' target/wine-namespace/a.json > /dev/null
          echo "Two independent Wine prefix process namespaces excluded one another's running fixture image"

      - name: Run isolated already-running Wine process attach smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-attach/config
          cp target/x86_64-pc-windows-gnu/release/intimatr.dll target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-helper.exe target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe target/wine-attach/
          cp config/wine-attach-target.exe.toml target/wine-attach/config/
          export WINEPREFIX="$RUNNER_TEMP/Fixture"
          mkdir -p "$WINEPREFIX"
          printf 'Name: Fixture\n' > "$WINEPREFIX/bottle.yml"
          export WINEARCH=win64
          export WINEDEBUG=-all
          xvfb-run -a wine target/wine-attach/wine-attach-target.exe &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/attach-target.pid
          windows_pid="$(cat target/wine-attach/attach-target.pid)"
          cp target/x86_64-pc-windows-gnu/release/wine-process-list.exe target/wine-attach/
          target/release/intimatr-bottles win-processes \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" > target/wine-attach/windows-pids.json
          grep -q "\"windows_pid\": $windows_pid" target/wine-attach/windows-pids.json
          # The target itself is a Linux-cross-built x86-64 PE executable.
          # A file-header match does not prove that generic Wine games are
          # safe to inject, but it guards against a guessed architecture.
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid and .pe_image_verified == true
            and .pe_image_architecture == "x86_64"
          )' target/wine-attach/windows-pids.json > /dev/null
          # The x64 fixture remote loader now requires verified live process
          # machine evidence. A Wine runner without IsWow64Process2 must fail
          # closed, rather than silently accept an assumed target bitness.
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid and .process_architecture_verified == true
            and .process_architecture == "x86_64"
            and .process_architecture_source == "is_wow64_process2"
          )' target/wine-attach/windows-pids.json > /dev/null
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid
            and .timer_import_coverage.all_four_static_names == true
            and .timer_import_coverage.query_performance_counter == true
            and .timer_import_coverage.get_tick_count64 == true
            and .timer_import_coverage.get_tick_count == true
            and .timer_import_coverage.time_get_time == true
          )' target/wine-attach/windows-pids.json > /dev/null
          echo "Wine live-process machine query: $(jq -r --argjson pid "$windows_pid" '.processes[] | select(.windows_pid == $pid) | (.process_architecture // "unavailable")' target/wine-attach/windows-pids.json)"
          grep -q '"attachment_attempted": false' target/wine-attach/windows-pids.json
          echo "Wine process inventory independently confirmed target Windows PID"
          # Mock only native Bottles' read-only JSON CLI; the actual Windows
          # process inventory still comes from Wine in this test.
          mkdir -p target/wine-attach/mocks
          cat > target/wine-attach/mocks/bottles-cli <<'MOCK_BOTTLES'
          #!/bin/sh
          case "$*" in
            "--json list bottles")
              printf '%s\n' '{"Fixture":{"Runner":"test-wine","Arch":"win64","Environment":"Gaming"}}'
              ;;
            "--json info bottles-path")
              printf '%s' "$RUNNER_TEMP"
              ;;
            "--json programs -b Fixture")
              if test -n "${INTIMATR_MOCK_PROGRAMS_JSON:-}"; then
                cat "$INTIMATR_MOCK_PROGRAMS_JSON"
              else
                printf '%s\n' '[{"name":"Unrelated Offline","executable":"Unrelated.exe","path":"C:\\Example\\Unrelated.exe"}]'
              fi
              ;;
            *)
              echo "Unexpected Bottles mock arguments: $*" >&2
              exit 2
              ;;
          esac
          MOCK_BOTTLES
          chmod +x target/wine-attach/mocks/bottles-cli
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli > target/wine-attach/live-match.json
          grep -q "\"windows_pid\": $windows_pid" target/wine-attach/live-match.json
          grep -q '"operation": "read_only_live_bottles_wine_match"' target/wine-attach/live-match.json
          grep -q '"bottle_prefix_association_verified": true' target/wine-attach/live-match.json
          # Live matching must NEVER silently choose system Wine for a
          # bottle that may require a patched or external runner.
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/missing-runner.stderr; then
            echo "ERROR: implicit default Wine runner was accepted" >&2
            exit 1
          fi
          grep -q 'missing --runner' target/wine-attach/missing-runner.stderr
          # Explicit Wine selection cannot silently fall back to PATH lookup.
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner wine \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/relative-runner.stderr; then
            echo "ERROR: unpinned PATH Wine runner was accepted" >&2
            exit 1
          fi
          grep -q 'absolute executable path' target/wine-attach/relative-runner.stderr
          grep -q '"runner_binary_verified": true' target/wine-attach/live-match.json
          grep -q '"runner_verified": false' target/wine-attach/live-match.json
          grep -q '"configured_runner_name": "test-wine"' target/wine-attach/live-match.json
          grep -q '"bottle_architecture": "win64"' target/wine-attach/live-match.json
          grep -q '"reason": "managed_or_external_runner_location_unknown"' target/wine-attach/live-match.json
          grep -q '"game_process_identity_verified": false' target/wine-attach/live-match.json
          grep -q '"status": "not_registered_in_selected_bottle"' target/wine-attach/live-match.json
          grep -q '"safe_to_attach": false' target/wine-attach/live-match.json
          grep -q '"attachment_attempted": false' target/wine-attach/live-match.json
          grep -q '"prefix_source": "configured_bottles_root"' target/wine-attach/live-match.json
          # Wrong explicit Wine prefix must fail before the PE helper runs.
          mkdir -p "$RUNNER_TEMP/Other/drive_c"
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --prefix "$RUNNER_TEMP/Other" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/wrong-prefix.stderr; then
            echo "ERROR: mismatched bottle and prefix were accepted" >&2
            exit 1
          fi
          grep -q 'supplied WINEPREFIX is not' target/wine-attach/wrong-prefix.stderr
          echo "Read-only Bottles prefix ownership rejected an unrelated prefix"
          if target/release/intimatr-bottles live-match \
            --bottle Missing \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/missing-bottle.stderr; then
            echo "ERROR: a nonexistent bottle was accepted" >&2
            exit 1
          fi
          grep -q 'selected bottle not found' target/wine-attach/missing-bottle.stderr
          echo "Read-only live Bottles/Wine matching verified with mocked native inventory"
          # Reuse the *real running* Wine fixture PID and verified image path,
          # but register its path using mocked Bottles metadata. This tests
          # explicit PID + full-path preflight, never arbitrary attachment.
          observed_path="$(jq -r --argjson pid "$windows_pid" '.processes[] | select(.windows_pid == $pid) | .full_image_path // empty' target/wine-attach/windows-pids.json)"
          test -n "$observed_path"
          jq -n --arg path "$observed_path" '[{
            "name":"Selected offline fixture",
            "executable":"wine-attach-target.exe",
            "path":$path
          }]' > target/wine-attach/mocks/selected-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/selected-programs.json"
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" > target/wine-attach/selected-preflight.json
          jq -e --argjson pid "$windows_pid" '.selected_candidate | select(
            .operation == "read_only_explicit_game_candidate_preflight"
            and .selected_windows_pid == $pid
            and .timer_import_coverage.all_four_static_names == true
            and (.process_creation_time_100ns | type == "string" and length > 0)
            and .pid_observed_in_selected_wineserver_snapshot == true
            and .image_observed_in_selected_wineserver_snapshot == true
            and .registered_identity_verified_at_snapshot == true
            and (.status == "registered_x64_candidate_for_review_only"
                 or .status == "architecture_unverified")
            and .safe_to_attach == false
            and .snapshot_only == true
            and .attachment_attempted == false
          )' target/wine-attach/selected-preflight.json > /dev/null
          # Read-only readiness aggregates prefix/runner/identity evidence.
          # A matching registered x64 fixture is still not a game attach.
          jq -e '.attachment_readiness | select(
            .operation == "read_only_live_game_attachment_readiness"
            and .snapshot_registered_identity_verified == true
            and .timer_import_coverage.all_four_static_names == true
            and (.selected_process_creation_time_100ns | type == "string" and length > 0)
            and .selected_pid_observed_in_prefix_wineserver_snapshot == true
            and .selected_image_observed_in_prefix_wineserver_snapshot == true
            and .bottle_prefix_verified == true
            and .configured_runner_verified == false
            and .safe_to_attach == false
            and .attachment_attempted == false
            and (.blockers | index("configured_wine_runner_unverified") != null)
            and (.blockers | index("live_process_prefix_ownership_unverified") != null)
            and (.blockers | index("production_game_loader_field_verification_missing") != null)
          )' target/wine-attach/selected-preflight.json > /dev/null
          # A native managed runner is stored in XDG_DATA_HOME/bottles/runners,
          # NOT a guessed sibling of the selected bottle's prefix.
          managed_home="$RUNNER_TEMP/intimatr-managed-xdg"
          mkdir -p "$managed_home/bottles/runners/test-wine/bin"
          ln -s "$(command -v wine)" "$managed_home/bottles/runners/test-wine/bin/wine"
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" > target/wine-attach/managed-runner.json
          jq -e '.runner_verified == true
              and .runner_binary_verified == true
              and .runner_audit.reason == "native_managed_runner_binary_matched"
              and .attachment_readiness.configured_runner_verified == true
              and .safe_to_attach == false
              and .attachment_attempted == false' target/wine-attach/managed-runner.json > /dev/null
          # A different existing executable is rejected before Wine is run.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner /usr/bin/false \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" 2> target/wine-attach/wrong-managed-runner.stderr; then
            echo "ERROR: unrelated managed Wine runner binary was accepted" >&2
            exit 1
          fi
          grep -q 'differs from the configured managed Bottles runner' target/wine-attach/wrong-managed-runner.stderr
          # Neither a recycled/missing PID nor a different full executable
          # path may be promoted to an identity match.
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid 4294967295 --exe "$observed_path" > target/wine-attach/missing-pid-preflight.json
          jq -e '.selected_candidate | select(
            .status == "selected_pid_not_in_snapshot"
            and .pid_observed_in_selected_wineserver_snapshot == false
            and .image_observed_in_selected_wineserver_snapshot == false
            and .registered_identity_verified_at_snapshot == false
            and .safe_to_attach == false
          )' target/wine-attach/missing-pid-preflight.json > /dev/null
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe 'C:\\Different\\Wrong.exe' > target/wine-attach/wrong-path-preflight.json
          jq -e '.selected_candidate | select(
            .status == "selected_executable_does_not_match_pid"
            and .pid_observed_in_selected_wineserver_snapshot == true
            and .image_observed_in_selected_wineserver_snapshot == false
            and .registered_identity_verified_at_snapshot == false
            and .safe_to_attach == false
          )' target/wine-attach/wrong-path-preflight.json > /dev/null
          jq -e '.attachment_readiness | select(
            .snapshot_registered_identity_verified == false
            and .status == "candidate_identity_or_architecture_unverified"
            and .safe_to_attach == false
            and (.blockers | index("selected_pid_executable_registration_unverified") != null)
          )' target/wine-attach/missing-pid-preflight.json > /dev/null
          jq -e '.attachment_readiness | select(
            .snapshot_registered_identity_verified == false
            and .status == "candidate_identity_or_architecture_unverified"
            and .safe_to_attach == false
            and (.blockers | index("selected_pid_executable_registration_unverified") != null)
          )' target/wine-attach/wrong-path-preflight.json > /dev/null
          unset INTIMATR_MOCK_PROGRAMS_JSON
          echo "Verified explicit Windows PID/full-image preflight and blocked game readiness against isolated Wine fixture"
          # A same-named executable in a DIFFERENT directory is not the
          # owned fixture beside wine-attach-helper.exe, even when it is
          # genuinely running under the same Wine prefix.
          mkdir -p target/wine-attach/decoy
          cp target/wine-attach/wine-attach-target.exe target/wine-attach/decoy/
          xvfb-run -a wine target/wine-attach/decoy/wine-attach-target.exe > target/wine-attach/decoy/stdout 2> target/wine-attach/decoy/stderr &
          decoy_launcher=$!
          trap 'kill "$launcher_pid" "$decoy_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/decoy/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/decoy/attach-target.pid
          decoy_pid="$(cat target/wine-attach/decoy/attach-target.pid)"
          test "$decoy_pid" != "$windows_pid"
          if target/release/intimatr-bottles probe-attach \
            --pid "$decoy_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/decoy-attach.stdout 2> target/wine-attach/decoy-attach.stderr; then
            echo "ERROR: unrelated same-basename Wine process received an attach" >&2
            exit 1
          fi
          grep -q "target is not the helper's owned Wine fixture" target/wine-attach/decoy-attach.stderr
          kill "$decoy_launcher" 2>/dev/null || true
          wait "$decoy_launcher" || true
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          echo "Wine fixture-only loader rejected a distinct same-named process"
          # Never fall back to the system Wine binary, even in fixture-only
          # remote-attach mode: a real Bottles prefix may use another runner.
          if target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe > target/wine-attach/missing-attach-runner.stdout 2> target/wine-attach/missing-attach-runner.stderr; then
            echo "ERROR: fixture remote attach accepted an implicit Wine runner" >&2
            exit 1
          fi
          grep -q 'missing --runner' target/wine-attach/missing-attach-runner.stderr
          echo "Wine fixture-only loader requires explicit runner selection"
          # Two distinct Linux invocations launch separate Windows helpers
          # against the same already-running fixture. Exactly one may load.
          target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/race-1.stdout 2> target/wine-attach/race-1.stderr &
          contender_one=$!
          target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/race-2.stdout 2> target/wine-attach/race-2.stderr &
          contender_two=$!
          if wait "$contender_one"; then success_one=1; else success_one=0; fi
          if wait "$contender_two"; then success_two=1; else success_two=0; fi
          if test $((success_one + success_two)) -ne 1; then
            echo "ERROR: expected exactly one remote attach success" >&2
            cat target/wine-attach/race-1.stderr target/wine-attach/race-2.stderr >&2
            exit 1
          fi
          if test "$success_one" -eq 0; then
            grep -q "refusing duplicate attach" target/wine-attach/race-1.stderr
          else
            grep -q "refusing duplicate attach" target/wine-attach/race-2.stderr
          fi
          echo "Wine same-target race: one attachment succeeded, one rejected"
          for i in $(seq 1 100); do
            if test -s target/wine-attach/attach-verified.flag; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/attach-verified.flag
          # The same target is still running. A second attach must refuse
          # the loaded module before creating a remote thread.
          if target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/duplicate.stdout 2> target/wine-attach/duplicate.stderr; then
            echo "ERROR: duplicate attach was unexpectedly accepted" >&2
            exit 1
          fi
          grep -q "refusing duplicate attach" target/wine-attach/duplicate.stderr
          echo "Wine test fixture rejected a second attach while running"
          touch target/wine-attach/attach-release.flag
          wait "$launcher_pid"
          trap - EXIT

          # Separate disposable selected-game target proves the opted-in
          # game helper is NOT limited to the fixture helper's adjacent EXE.
          # This is still our own PE fixture, never an actual installed game.
          mkdir -p target/wine-attach/game-fixture/config
          cp target/wine-attach/wine-attach-target.exe target/wine-attach/game-fixture/
          cp config/wine-attach-target.exe.toml target/wine-attach/game-fixture/config/
          INTIMATR_TEST_HOOK_STATUS_GATE=1 INTIMATR_TEST_REMOTE_STOP_WITH_HOOKS=1 INTIMATR_TEST_EXTERNAL_TIMER_ARM=1 INTIMATR_TEST_EXTERNAL_RATE_COMMANDS=1 xvfb-run -a wine target/wine-attach/game-fixture/wine-attach-target.exe >target/wine-attach/game-fixture/stdout 2>target/wine-attach/game-fixture/stderr &
          game_launcher=$!
          trap 'kill "$game_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/game-fixture/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/game-fixture/attach-target.pid
          game_pid="$(cat target/wine-attach/game-fixture/attach-target.pid)"
          target/release/intimatr-bottles win-processes \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" > target/wine-attach/game-before.json
          game_image="$(jq -r --argjson pid "$game_pid" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-attach/game-before.json)"
          test -n "$game_image"
          game_created="$(jq -r --argjson pid "$game_pid" '[.processes[] | select(.windows_pid == $pid) | .process_creation_time_100ns // empty] | first // empty' target/wine-attach/game-before.json)"
          test -n "$game_created" && test "$game_created" != "0"
          jq -n --arg path "$game_image" '[{
            "name":"Selected standalone offline test fixture",
            "executable":"wine-attach-target.exe",
            "path":$path
          }]' > target/wine-attach/mocks/game-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/game-programs.json"
          game_args=(
            --bottle Fixture
            --helper target/wine-attach/wine-process-list.exe
            --attach-helper "$(pwd)/target/wine-attach/wine-game-attach-helper.exe"
            --runner "$(command -v wine)"
            --bottles-cli target/wine-attach/mocks/bottles-cli
            --pid "$game_pid" --exe "$game_image"
            --created-100ns "$game_created"
          )
          # No accidental remote load without the explicit acknowledgement.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game "${game_args[@]}" >target/wine-attach/game-missing-consent.stdout 2>target/wine-attach/game-missing-consent.stderr; then
            echo "ERROR: game helper allowed attach without offline consent" >&2
            exit 1
          fi
          grep -q 'offline-single-player acknowledgment is required' target/wine-attach/game-missing-consent.stderr
          # Wrong Windows PID/image pair is rejected before the game helper.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --attach-helper "$(pwd)/target/wine-attach/wine-game-attach-helper.exe" \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$game_pid" --exe 'C:\\Games\\Wrong.exe' \
            --created-100ns "$game_created" \
            --offline-single-player >target/wine-attach/game-wrong-path.stdout 2>target/wine-attach/game-wrong-path.stderr; then
            echo "ERROR: incorrect game image was attached" >&2
            exit 1
          fi
          grep -q 'candidate PID/image/architecture was not verified' target/wine-attach/game-wrong-path.stderr
          # The operator's previously selected process generation must also
          # match today's fresh snapshot; PID+path alone is insufficient.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --attach-helper "$(pwd)/target/wine-attach/wine-game-attach-helper.exe" \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$game_pid" --exe "$game_image" \
            --created-100ns "$((game_created + 1))" --offline-single-player \
            >target/wine-attach/game-stale-selection.stdout 2>target/wine-attach/game-stale-selection.stderr; then
            echo "ERROR: stale operator-selected game identity was accepted" >&2
            exit 1
          fi
          grep -q 'selected process creation time differs' target/wine-attach/game-stale-selection.stderr
          # The same PID and identical image with a wrong process generation
          # must be refused by the Windows helper before remote DLL loading.
          bad_created="$((game_created + 1))"
          if wine target/wine-attach/wine-game-attach-helper.exe \
            --pid "$game_pid" --exe "$game_image" \
            --created-100ns "$bad_created" --offline-single-player \
            >target/wine-attach/game-bad-generation.stdout 2>target/wine-attach/game-bad-generation.stderr; then
            echo "ERROR: game helper accepted an incorrect process creation time" >&2
            exit 1
          fi
          grep -q 'creation-time identity mismatch' target/wine-attach/game-bad-generation.stderr
          # An unattached target has no Intimatr module; status must not
          # turn inspection into an implicit attachment.
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-before.json
          jq -e '.operation == "explicit_offline_single_player_game_status"
            and .intimatr_module_loaded == false
            and .runtime_state == "absent"
            and .runtime_running_verified == false
            and .timer_hook_state == "none"
            and .timer_hooks_installed_verified == false
            and .installed_virtual_clock_multiplier == null
            and .main_image_four_timer_imports_present == null
            and .main_image_timer_imports_observed == null
            and .main_image_timer_imports_missing == null
            and .static_pe_timer_import_coverage.all_four_static_names == true
            and .speed_controls_verified == false' target/wine-attach/game-before.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-attach.json
          jq -e --arg created "$game_created" '.operation == "explicit_offline_single_player_game_attachment"
            and .intimatr_module_loaded == true
            and .runtime_running_verified == true
            and .verified_process_creation_time_100ns == $created
            and .speed_controls_verified == false
            and .attachment_attempted == true
            and .offline_single_player_acknowledged == true' target/wine-attach/game-attach.json > /dev/null
          # Attachment alone leaves all game IAT imports untouched.
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-before-arm.json
          jq -e '.runtime_state == "running"
            and .timer_hook_state == "none"
            and .timer_hooks_installed_verified == false
            and .main_image_four_timer_imports_present == true
            and (.main_image_timer_imports_observed | length) == 4
            and (.main_image_timer_imports_missing | length) == 0
            and .static_pe_timer_import_coverage.all_four_static_names == true
            and .speed_controls_verified == false' target/wine-attach/game-before-arm.json > /dev/null
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles set-game-speed "${game_args[@]}" --offline-single-player --experimental-four-timers --preset half >target/wine-attach/game-rate-before-arm.stdout 2>target/wine-attach/game-rate-before-arm.stderr; then
            echo "ERROR: game speed changed without timer activation" >&2
            exit 1
          fi
          grep -q 'no active four-timer IAT hooks' target/wine-attach/game-rate-before-arm.stderr
          # The experimental marker must be separate from offline consent.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers "${game_args[@]}" --offline-single-player >target/wine-attach/game-arm-no-consent.stdout 2>target/wine-attach/game-arm-no-consent.stderr; then
            echo "ERROR: game timer activation accepted without experimental opt-in" >&2
            exit 1
          fi
          grep -q 'requires explicit --experimental-four-timers' target/wine-attach/game-arm-no-consent.stderr
          for i in $(seq 1 100); do
            if test -s target/wine-attach/game-fixture/attach-await-arm.flag; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/game-fixture/attach-await-arm.flag
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers "${game_args[@]}" --offline-single-player --experimental-four-timers >target/wine-attach/game-armed.json
          jq -e '.operation == "explicit_offline_single_player_game_timer_activation"
            and .runtime_running_verified == true
            and .timer_hooks_installed_verified == true
            and .installed_virtual_clock_multiplier == 1.0
            and .gameplay_speed_verified == false
            and .speed_controls_verified == false
            and .experimental_four_timers_acknowledged == true' target/wine-attach/game-armed.json > /dev/null
          # Repeated timer arming must not repatch imports.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers "${game_args[@]}" --offline-single-player --experimental-four-timers >target/wine-attach/game-arm-duplicate.stdout 2>target/wine-attach/game-arm-duplicate.stderr; then
            echo "ERROR: duplicate game timer activation succeeded" >&2
            exit 1
          fi
          grep -q 'already installed or need cleanup' target/wine-attach/game-arm-duplicate.stderr
          touch target/wine-attach/game-fixture/attach-external-armed.flag
          # Pause the disposable target while its four imports are hooked.
          for i in $(seq 1 100); do
            if test -s target/wine-attach/game-fixture/attach-hooks-ready.flag; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/game-fixture/attach-hooks-ready.flag
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-hooked.json
          jq -e '.intimatr_module_loaded == true
            and .runtime_state == "running"
            and .timer_hook_state == "installed_four_timers"
            and .timer_hooks_installed_verified == true
            and .main_image_four_timer_imports_present == true
            and (.main_image_timer_imports_observed | length) == 4
            and .speed_controls_verified == false' target/wine-attach/game-hooked.json > /dev/null
          touch target/wine-attach/game-fixture/attach-hooks-inspected.flag
          for preset in half double normal; do
            for i in $(seq 1 200); do
              if test -s "target/wine-attach/game-fixture/attach-rate-$preset-ready.flag"; then
                break
              fi
              sleep 0.1
            done
            test -s "target/wine-attach/game-fixture/attach-rate-$preset-ready.flag"
            XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles set-game-speed "${game_args[@]}" --offline-single-player --experimental-four-timers --preset "$preset" >"target/wine-attach/game-rate-$preset.json"
            expected_rate=1.0
            case "$preset" in
              half) expected_rate=0.5 ;;
              double) expected_rate=2.0 ;;
            esac
            jq -e --argjson rate "$expected_rate" '
                .operation == "explicit_offline_single_player_game_speed_preset"
                and .installed_virtual_clock_multiplier == $rate
                and .timer_hooks_installed_verified == true
                and .gameplay_speed_verified == false' "target/wine-attach/game-rate-$preset.json" > /dev/null
            XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >"target/wine-attach/game-rate-$preset-status.json"
            jq -e --argjson rate "$expected_rate" '
                .installed_virtual_clock_multiplier == $rate
                and .timer_hook_state == "installed_four_timers"
                and .gameplay_speed_verified == false' "target/wine-attach/game-rate-$preset-status.json" > /dev/null
            touch "target/wine-attach/game-fixture/attach-rate-$preset-done.flag"
          done
          for i in $(seq 1 100); do
            if test -s target/wine-attach/game-fixture/attach-verified.flag; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/game-fixture/attach-verified.flag
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-running.json
          jq -e '.intimatr_module_loaded == true
            and .runtime_state == "running"
            and .runtime_running_verified == true
            and .runtime_stopped_verified == false
            and .timer_hook_state == "installed_four_timers"
            and .timer_hooks_installed_verified == true
            and .speed_controls_verified == false' target/wine-attach/game-running.json > /dev/null
          # The same process must refuse duplicate game helper attachment.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-duplicate.stdout 2>target/wine-attach/game-duplicate.stderr; then
            echo "ERROR: second game attach succeeded" >&2
            exit 1
          fi
          grep -q 'refusing duplicate attach' target/wine-attach/game-duplicate.stderr
          # The disposable target has *not* disabled its hooks. External
          # stop-game must restore the four installed timer imports itself.
          # The DLL remains mapped because callback code may still be held.
          # Stop the exact selected process and keep callback code mapped.
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles stop-game "${game_args[@]}" --offline-single-player > target/wine-attach/game-stop.json
          jq -e --arg created "$game_created" '
              .operation == "explicit_offline_single_player_game_shutdown"
              and .runtime_stopped_verified == true
              and .intimatr_module_loaded == true
              and .intimatr_module_unloaded == false
              and .verified_process_creation_time_100ns == $created
              and .shutdown_attempted == true
              and .speed_controls_verified == false' target/wine-attach/game-stop.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${game_args[@]}" --offline-single-player >target/wine-attach/game-stopped-status.json
          jq -e '.intimatr_module_loaded == true
            and .runtime_state == "stopped"
            and .runtime_running_verified == false
            and .runtime_stopped_verified == true
            and .timer_hook_state == "none"
            and .timer_hooks_installed_verified == false
            and .installed_virtual_clock_multiplier == null
            and .main_image_four_timer_imports_present == true
            and (.main_image_timer_imports_missing | length) == 0
            and .speed_controls_verified == false' target/wine-attach/game-stopped-status.json > /dev/null
          # Stopped runtimes may not resurrect hooks even with fresh consent.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers "${game_args[@]}" --offline-single-player --experimental-four-timers >target/wine-attach/game-arm-after-stop.stdout 2>target/wine-attach/game-arm-after-stop.stderr; then
            echo "ERROR: timer hooks rearmed in stopped game runtime" >&2
            exit 1
          fi
          grep -q 'target runtime is not Running' target/wine-attach/game-arm-after-stop.stderr
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles set-game-speed "${game_args[@]}" --offline-single-player --experimental-four-timers --preset double >target/wine-attach/game-rate-after-stop.stdout 2>target/wine-attach/game-rate-after-stop.stderr; then
            echo "ERROR: game speed changed in a stopped runtime" >&2
            exit 1
          fi
          grep -q 'no active four-timer IAT hooks' target/wine-attach/game-rate-after-stop.stderr
          # Repeated stop is idempotent; never free a still-referenced DLL.
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles stop-game "${game_args[@]}" --offline-single-player > target/wine-attach/game-stopped-again.json
          jq -e '.runtime_stopped_verified == true and .intimatr_module_unloaded == false' target/wine-attach/game-stopped-again.json > /dev/null
          touch target/wine-attach/game-fixture/attach-release.flag
          wait "$game_launcher"
          trap - EXIT
          unset INTIMATR_MOCK_PROGRAMS_JSON
          echo "Explicit offline-game CLI loaded exact DLL into separately located disposable Wine PE test target"

  # Build a Windows PE DLL on a Linux host. This is the artifact Wine will
  # eventually load into an opted-in game process; it is not a Linux .so.
  linux-wine-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Verify portable virtual-clock core on Linux
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib speed
          cargo test --locked --lib bottles
          cargo test --locked --test speed_invariants
          cargo test --locked --bin intimatr-bottles

      - name: Build native Linux Bottles inventory CLI
        run: |
          cargo build --locked --release --bin intimatr-bottles
          test -s target/release/intimatr-bottles
          file target/release/intimatr-bottles | grep -q 'ELF 64-bit'

      - name: Verify read-only global bottle game precedence in Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          target/release/intimatr-bottles profile-check \
            --config config/speed-overrides.example.toml \
            --bottle Games \
            --exe 'c:/games/offline.exe' > target/intimatr-profile-qa.json
          grep -q '"operation": "read_only_profile_resolution"' target/intimatr-profile-qa.json
          grep -q '"matched_game": true' target/intimatr-profile-qa.json
          grep -q '"initial_multiplier": 2.0' target/intimatr-profile-qa.json
          grep -q '"attachment_attempted": false' target/intimatr-profile-qa.json
          target/release/intimatr-bottles profile-check \
            --config config/speed-overrides.example.toml \
            --bottle Online \
            --exe 'C:\Games\Network.exe' > target/intimatr-profile-excluded.json
          grep -q '"excluded": true' target/intimatr-profile-excluded.json
          grep -q '"enabled": false' target/intimatr-profile-excluded.json

      - name: Verify read-only Linux PID inventory and explicit Wine PID uncertainty
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(pwd)/target/intimatr-proc-qa-fixture"
          mkdir -p "$prefix/drive_c"
          WINEPREFIX="$prefix" sleep 20 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            target/release/intimatr-bottles processes --prefix "$prefix" > target/intimatr-processes.json
            if grep -q "\"linux_pid\": $fixture_pid" target/intimatr-processes.json; then
              break
            fi
            sleep 0.1
          done
          grep -q "\"linux_pid\": $fixture_pid" target/intimatr-processes.json
          grep -q '"windows_pid": null' target/intimatr-processes.json
          grep -q '"safe_to_attach": false' target/intimatr-processes.json
          grep -q '"attachment_attempted": false' target/intimatr-processes.json
          echo "Verified Linux prefix process discovery without Windows PID guessing"
          kill "$fixture_pid" 2>/dev/null || true
          wait "$fixture_pid" || true
          trap - EXIT

      - name: Verify read-only Bottles registered game and Wine PID path correlation
        shell: bash
        run: |
          set -euo pipefail
          target/release/intimatr-bottles match-snapshot \
            --bottle Offline \
            --programs config/match-registered.example.json \
            --windows config/match-wine-processes.example.json > target/intimatr-match-report.json
          grep -q '"operation": "read_only_wine_registered_program_matching"' target/intimatr-match-report.json
          grep -q '"windows_pid": 42' target/intimatr-match-report.json
          grep -q '"registered_program_name": "Verified offline"' target/intimatr-match-report.json
          grep -q '"status": "image_path_unknown"' target/intimatr-match-report.json
          grep -q '"safe_to_attach": false' target/intimatr-match-report.json
          jq -e '.matches[] | select(
            .windows_pid == 44 and .status == "unsupported_x64_dll_architecture"
            and .x64_dll_compatible == false
            and .registered_program_name == null and .safe_to_attach == false
          )' target/intimatr-match-report.json > /dev/null
          grep -q '"attachment_attempted": false' target/intimatr-match-report.json

      - name: Strict Clippy for Windows GNU target from Linux
        run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings

      - name: Cross-build Wine-target Windows DLL on Linux
        run: cargo build --locked --release --lib --target x86_64-pc-windows-gnu

      - name: Cross-build read-only Windows PID probe and explicit game attach helper
        run: cargo build --locked --release --bin wine-process-list --bin wine-game-attach-helper --target x86_64-pc-windows-gnu

      - name: Verify read-only Windows PID probe PE artifact
        shell: bash
        run: |
          set -euo pipefail
          probe="target/x86_64-pc-windows-gnu/release/wine-process-list.exe"
          test -s "$probe"
          file "$probe" | grep -Eq 'PE32[+].*x86-64'
          helper="target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe"
          test -s "$helper"
          file "$helper" | grep -Eq 'PE32[+].*x86-64'

      - name: Cross-build Windows speed RPC client for Wine
        run: cargo build --locked --release --bin intimatr-speed --target x86_64-pc-windows-gnu

      - name: Verify Windows Wine speed client PE artifact
        shell: bash
        run: |
          set -euo pipefail
          client="target/x86_64-pc-windows-gnu/release/intimatr-speed.exe"
          test -s "$client"
          file "$client" | grep -Eq 'PE32[+].*x86-64'
          sha256sum "$client"

      - name: Verify Windows PE x86-64 DLL artifact
        shell: bash
        run: |
          set -euo pipefail
          dll="target/x86_64-pc-windows-gnu/release/intimatr.dll"
          test -s "$dll"
          file "$dll"
          file "$dll" | grep -Eq 'PE32[+].*DLL.*x86-64'
          x86_64-w64-mingw32-objdump -f "$dll"
          sha256sum "$dll"

      - name: Package and verify combined Linux/Wine release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="ci-${{ github.run_number }}"
          archive="$(bash scripts/package-linux-release.sh "$version")"
          bash scripts/verify-linux-release.sh "$archive" "$version"

      - name: Upload verified Linux/Wine bundle and archive checksum
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-linux-wine-bundle-x86_64-${{ github.sha }}
          path: |
            dist/intimatr-linux-wine-x86_64-*.tar.gz
            dist/intimatr-linux-wine-x86_64-*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Linux-cross-built Windows DLL
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-wine-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/intimatr.dll
          if-no-files-found: error

      - name: Upload explicit offline Wine game helper
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-game-attach-helper-wine-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe
          if-no-files-found: error

      - name: Upload read-only Wine Windows PID probe
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-wine-process-list-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/wine-process-list.exe
          if-no-files-found: error

      - name: Upload Linux-cross-built Windows speed RPC client
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-speed-wine-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/intimatr-speed.exe
          if-no-files-found: error

      - name: Upload native Linux Bottles inventory CLI
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-bottles-linux-x86_64-${{ github.sha }}
          path: target/release/intimatr-bottles
          if-no-files-found: error
