              --config "$(pwd)/target/wine-attach/host-speed-rules.toml" \
              --bottle Fixture --exe 'C:\Unrelated.exe' \
              --program 'Selected standalone offline test fixture' \
              --profile "$WINEPREFIX/drive_c/intimatr-ci-speed.toml" \
              --bottles-cli target/wine-attach/mocks/bottles-cli \
              --offline-single-player --launch \
              >target/wine-attach/launch-wrong-game.stdout 2>target/wine-attach/launch-wrong-game.stderr; then
            echo "ERROR: profile-launch accepted a different game" >&2
            exit 1
