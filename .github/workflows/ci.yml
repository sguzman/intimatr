name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build x86_64 Windows DLL
        run: cargo build --locked --release --lib --target x86_64-pc-windows-msvc

      - name: Verify DLL artifact
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/intimatr.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "Expected DLL artifact was not produced: $dll"
          }
          $item = Get-Item $dll
          if ($item.Length -le 0) {
            throw "DLL artifact is empty: $dll"
          }
          Write-Host "Verified $dll ($($item.Length) bytes)"

      - name: Package and verify release layout
        shell: pwsh
        run: |
          $version = "ci-${{ github.run_number }}"
          $zip = & ./scripts/package-release.ps1 -Version $version
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "Packaging smoke test did not produce an archive: $zip"
          }
          & ./scripts/verify-release.ps1 -ArchivePath $zip -ExpectedVersion $version | Out-Null
          Write-Host "Verified release package $zip"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr.dll
          if-no-files-found: error



  # Disposable Wine prefix, no personal Bottles state or game executables.
  wine-load-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install compiler and Wine runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64 wine xvfb

      - name: Cross-build DLL and Windows probe on Linux
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --lib --bin wine-load-probe

      - name: Run isolated Wine DLL load and shutdown smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-smoke/config
          cp target/x86_64-pc-windows-gnu/release/intimatr.dll target/wine-smoke/
          cp target/x86_64-pc-windows-gnu/release/wine-load-probe.exe target/wine-smoke/
          cp config/wine-load-probe.exe.toml target/wine-smoke/config/
          export WINEPREFIX="$RUNNER_TEMP/intimatr-wine-smoke"
          export WINEARCH=win64
          export WINEDEBUG=-all
          xvfb-run -a wine target/wine-smoke/wine-load-probe.exe

  # Build a Windows PE DLL on a Linux host. This is the artifact Wine will
  # eventually load into an opted-in game process; it is not a Linux .so.
  linux-wine-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Verify portable virtual-clock core on Linux
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib speed
          cargo test --locked --lib bottles

      - name: Build native Linux Bottles inventory CLI
        run: |
          cargo build --locked --release --bin intimatr-bottles
          test -s target/release/intimatr-bottles
          file target/release/intimatr-bottles | grep -q 'ELF 64-bit'

      - name: Strict Clippy for Windows GNU target from Linux
        run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings

      - name: Cross-build Wine-target Windows DLL on Linux
        run: cargo build --locked --release --lib --target x86_64-pc-windows-gnu

      - name: Verify Windows PE x86-64 DLL artifact
        shell: bash
        run: |
          set -euo pipefail
          dll="target/x86_64-pc-windows-gnu/release/intimatr.dll"
          test -s "$dll"
          file "$dll"
          file "$dll" | grep -Eq 'PE32[+].*DLL.*x86-64'
          x86_64-w64-mingw32-objdump -f "$dll"
          sha256sum "$dll"

      - name: Upload Linux-cross-built Windows DLL
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-wine-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/intimatr.dll
          if-no-files-found: error

      - name: Upload native Linux Bottles inventory CLI
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-bottles-linux-x86_64-${{ github.sha }}
          path: target/release/intimatr-bottles
          if-no-files-found: error
