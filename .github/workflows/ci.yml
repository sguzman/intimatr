name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep verification for the latest ref while preventing superseded pushes
# from occupying Windows and Wine runners concurrently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build x86_64 Windows DLL and isolated timer probe
        run: cargo build --locked --release --lib --bin wine-load-probe --bin intimatr-speed --target x86_64-pc-windows-msvc

      - name: Verify DLL artifact
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/intimatr.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "Expected DLL artifact was not produced: $dll"
          }
          $item = Get-Item $dll
          if ($item.Length -le 0) {
            throw "DLL artifact is empty: $dll"
          }
          Write-Host "Verified $dll ($($item.Length) bytes)"

      - name: Verify Windows speed RPC client executable
        shell: pwsh
        run: |
          $client = "target/x86_64-pc-windows-msvc/release/intimatr-speed.exe"
          if (-not (Test-Path $client -PathType Leaf)) {
            throw "Missing Windows speed RPC client executable: $client"
          }
          if ((Get-Item $client).Length -le 0) {
            throw "Windows speed RPC client is empty: $client"
          }
          Write-Host "Verified $client"

      - name: Run native Windows four-timer and rollback smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "target/x86_64-pc-windows-msvc/release"
          $destination = "target/windows-smoke"
          New-Item -ItemType Directory -Force "$destination/config" | Out-Null
          Copy-Item "$source/intimatr.dll" "$destination/intimatr.dll"
          Copy-Item "$source/wine-load-probe.exe" "$destination/wine-load-probe.exe"
          Copy-Item "$source/intimatr-speed.exe" "$destination/intimatr-speed.exe"
          Copy-Item "config/wine-load-probe.exe.toml" "$destination/config/wine-load-probe.exe.toml"
          Push-Location $destination
          try {
            & ./wine-load-probe.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Native Windows isolated timer smoke failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Package and verify release layout
        shell: pwsh
        run: |
          $version = "ci-${{ github.run_number }}"
          $zip = & ./scripts/package-release.ps1 -Version $version
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "Packaging smoke test did not produce an archive: $zip"
          }
          & ./scripts/verify-release.ps1 -ArchivePath $zip -ExpectedVersion $version | Out-Null
          Write-Host "Verified release package $zip"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr.dll
          if-no-files-found: error



      - name: Upload Windows speed RPC client
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-speed-windows-msvc-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr-speed.exe
          if-no-files-found: error

  # Disposable Wine prefix, no personal Bottles state or game executables.
  wine-load-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install compiler and Wine runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64 wine xvfb

      - name: Cross-build DLL and Windows probes on Linux
        run: cargo build --locked --release --target x86_64-pc-windows-gnu --lib --bin wine-load-probe --bin wine-attach-helper --bin wine-game-attach-helper --bin wine-attach-target --bin wine-incompatible-target --bin wine-process-list --bin intimatr-speed

      - name: Build native Linux test orchestration CLI
        run: cargo build --locked --release --bin intimatr-bottles

      - name: Inspect PE timer compatibility without launching Wine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-pe-compat
          target/release/intimatr-bottles pe-compat --exe "$(pwd)/target/x86_64-pc-windows-gnu/release/wine-attach-target.exe" >target/wine-pe-compat/full.json
          jq -e '.operation == "read_only_linux_pe_timer_compatibility"
            and .static_import_status == "static_four_timer_names_present"
            and .static_timer_import_coverage.all_four_static_names == true
            and (.static_timer_imports_missing | length) == 0
            and .requires_live_wine_import_verification == true
            and .gameplay_speed_verified == false
            and .process_attachment_attempted == false
            and .timer_hook_installation_attempted == false' target/wine-pe-compat/full.json > /dev/null
          target/release/intimatr-bottles pe-compat --exe "$(pwd)/target/x86_64-pc-windows-gnu/release/wine-incompatible-target.exe" >target/wine-pe-compat/missing.json
          jq -e '.static_import_status == "static_timer_imports_missing"
            and .static_timer_import_coverage.time_get_time == false
            and (.static_timer_imports_missing | index("timeGetTime") != null)
            and .process_attachment_attempted == false' target/wine-pe-compat/missing.json > /dev/null
          printf 'not a PE image\n' >target/wine-pe-compat/invalid.exe
          target/release/intimatr-bottles pe-compat --exe "$(pwd)/target/wine-pe-compat/invalid.exe" >target/wine-pe-compat/unknown.json
          jq -e '.static_import_status == "static_import_inventory_unknown"
            and .static_timer_import_coverage == null
            and .static_timer_imports_missing == null
            and (.inspection_error | type == "string")
            and .timer_hook_installation_attempted == false' target/wine-pe-compat/unknown.json > /dev/null
          if target/release/intimatr-bottles pe-compat --exe wine-attach-target.exe >/dev/null 2>target/wine-pe-compat/relative.stderr; then
            echo "ERROR: read-only PE compatibility accepted relative path" >&2
            exit 1
          fi
          grep -q 'absolute Linux file path' target/wine-pe-compat/relative.stderr

      - name: Run isolated Wine DLL load and shutdown smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-smoke/config
          cp target/x86_64-pc-windows-gnu/release/intimatr.dll target/wine-smoke/
          cp target/x86_64-pc-windows-gnu/release/wine-load-probe.exe target/wine-smoke/
          cp target/x86_64-pc-windows-gnu/release/intimatr-speed.exe target/wine-smoke/
          cp config/wine-load-probe.exe.toml target/wine-smoke/config/
          export WINEPREFIX="$RUNNER_TEMP/intimatr-wine-smoke"
          export WINEARCH=win64
          export WINEDEBUG=-all
          xvfb-run -a wine target/wine-smoke/wine-load-probe.exe

      - name: Exercise native Linux speed manager against hooked Wine fixture
        shell: bash
        run: xvfb-run -a bash scripts/wine-speed-bridge-smoke.sh

      - name: Verify independent Wine prefix process namespaces
        shell: bash
        run: |
          set -euo pipefail
          # Two independent, disposable Wine sessions. The host process
          # inventory must not accidentally return a target from another
          # WINEPREFIX even when the executable basename is identical.
          mkdir -p target/wine-namespace/a target/wine-namespace/b
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-namespace/a/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-namespace/b/
          cp target/x86_64-pc-windows-gnu/release/wine-process-list.exe target/wine-namespace/
          prefix_a="$RUNNER_TEMP/namespace-a"
          prefix_b="$RUNNER_TEMP/namespace-b"
          mkdir -p "$prefix_a" "$prefix_b"
          # Initialize prefixes before launching the short-lived fixtures.
          WINEARCH=win64 WINEDEBUG=-all WINEPREFIX="$prefix_a" xvfb-run -a wineboot -u >/dev/null 2>&1
          WINEARCH=win64 WINEDEBUG=-all WINEPREFIX="$prefix_b" xvfb-run -a wineboot -u >/dev/null 2>&1
          WINEDEBUG=-all WINEPREFIX="$prefix_a" xvfb-run -a wine target/wine-namespace/a/wine-attach-target.exe >target/wine-namespace/a/stdout 2>target/wine-namespace/a/stderr &
          launcher_a=$!
          WINEDEBUG=-all WINEPREFIX="$prefix_b" xvfb-run -a wine target/wine-namespace/b/wine-attach-target.exe >target/wine-namespace/b/stdout 2>target/wine-namespace/b/stderr &
          launcher_b=$!
          trap 'kill "$launcher_a" "$launcher_b" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-namespace/a/attach-target.pid && test -s target/wine-namespace/b/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-namespace/a/attach-target.pid
          test -s target/wine-namespace/b/attach-target.pid
          pid_a="$(cat target/wine-namespace/a/attach-target.pid)"
          pid_b="$(cat target/wine-namespace/b/attach-target.pid)"
          target/release/intimatr-bottles win-processes --prefix "$prefix_a" --helper target/wine-namespace/wine-process-list.exe --runner "$(command -v wine)" > target/wine-namespace/a.json
          target/release/intimatr-bottles win-processes --prefix "$prefix_b" --helper target/wine-namespace/wine-process-list.exe --runner "$(command -v wine)" > target/wine-namespace/b.json
          # Full image paths distinguish identical basenames across prefixes;
          # numerical Windows PIDs can collide between independent sessions.
          image_a="$(jq -r --argjson pid "$pid_a" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-namespace/a.json)"
          image_b="$(jq -r --argjson pid "$pid_b" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-namespace/b.json)"
          test -n "$image_a" && test -n "$image_b" && test "$image_a" != "$image_b"
          jq -e --arg path "$image_a" '([.processes[] | select(.full_image_path == $path)] | length) == 0' target/wine-namespace/b.json > /dev/null
          jq -e --arg path "$image_b" '([.processes[] | select(.full_image_path == $path)] | length) == 0' target/wine-namespace/a.json > /dev/null
          echo "Two independent Wine prefix process namespaces excluded one another's running fixture image"

      - name: Run isolated already-running Wine process attach smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wine-attach/config
          cp target/x86_64-pc-windows-gnu/release/intimatr.dll target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-attach-helper.exe target/wine-attach/
          cp target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe target/wine-attach/
          cp config/wine-attach-target.exe.toml target/wine-attach/config/
          export WINEPREFIX="$RUNNER_TEMP/Fixture"
          mkdir -p "$WINEPREFIX"
          printf 'Name: Fixture\n' > "$WINEPREFIX/bottle.yml"
          export WINEARCH=win64
          export WINEDEBUG=-all
          xvfb-run -a wine target/wine-attach/wine-attach-target.exe &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/attach-target.pid
          windows_pid="$(cat target/wine-attach/attach-target.pid)"
          cp target/x86_64-pc-windows-gnu/release/wine-process-list.exe target/wine-attach/
          target/release/intimatr-bottles win-processes \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" > target/wine-attach/windows-pids.json
          grep -q "\"windows_pid\": $windows_pid" target/wine-attach/windows-pids.json
          # The target itself is a Linux-cross-built x86-64 PE executable.
          # A file-header match does not prove that generic Wine games are
          # safe to inject, but it guards against a guessed architecture.
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid and .pe_image_verified == true
            and .pe_image_architecture == "x86_64"
          )' target/wine-attach/windows-pids.json > /dev/null
          # The x64 fixture remote loader now requires verified live process
          # machine evidence. A Wine runner without IsWow64Process2 must fail
          # closed, rather than silently accept an assumed target bitness.
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid and .process_architecture_verified == true
            and .process_architecture == "x86_64"
            and .process_architecture_source == "is_wow64_process2"
          )' target/wine-attach/windows-pids.json > /dev/null
          jq -e --argjson pid "$windows_pid" '.processes[] | select(
            .windows_pid == $pid
            and .timer_import_coverage.all_four_static_names == true
            and .timer_import_coverage.query_performance_counter == true
            and .timer_import_coverage.get_tick_count64 == true
            and .timer_import_coverage.get_tick_count == true
            and .timer_import_coverage.time_get_time == true
          )' target/wine-attach/windows-pids.json > /dev/null
          echo "Wine live-process machine query: $(jq -r --argjson pid "$windows_pid" '.processes[] | select(.windows_pid == $pid) | (.process_architecture // "unavailable")' target/wine-attach/windows-pids.json)"
          grep -q '"attachment_attempted": false' target/wine-attach/windows-pids.json
          echo "Wine process inventory independently confirmed target Windows PID"
          # Mock only native Bottles' read-only JSON CLI; the actual Windows
          # process inventory still comes from Wine in this test.
          mkdir -p target/wine-attach/mocks
          cat > target/wine-attach/mocks/bottles-cli <<'MOCK_BOTTLES'
          #!/bin/sh
          case "$*" in
            "--json list bottles")
              if test -n "${INTIMATR_MOCK_BOTTLES_JSON:-}"; then
                cat "$INTIMATR_MOCK_BOTTLES_JSON"
              else
                printf '%s\n' '{"Fixture":{"Runner":"test-wine","Arch":"win64","Environment":"Gaming","Limit_System_Environment":true,"Environment_Variables":{},"Inherited_Environment_Variables":["INTIMATR_SPEED_PROFILE"]}}'
              fi
              ;;
            "--json info bottles-path")
              printf '%s' "$RUNNER_TEMP"
              ;;
            "--json programs -b Fixture")
              if test -n "${INTIMATR_MOCK_PROGRAMS_JSON:-}"; then
                cat "$INTIMATR_MOCK_PROGRAMS_JSON"
              else
                printf '%s\n' '[{"name":"Unrelated Offline","executable":"Unrelated.exe","path":"C:\\Example\\Unrelated.exe"}]'
              fi
              ;;
            "run -b Fixture -p Selected standalone offline test fixture")
              test -n "${INTIMATR_MOCK_LAUNCH_RECEIPT:-}" || exit 4
              printf '%s\n' "${INTIMATR_SPEED_PROFILE:-missing}" > "$INTIMATR_MOCK_LAUNCH_RECEIPT"
              # With this opt-in, the mock launches our disposable Wine PE
              # *synchronously*, retaining the native CLI process until
              # the game fixture exits. No real Bottles is present in CI.
              if test "${INTIMATR_MOCK_LAUNCH_WINE_CHILD:-0}" = 1; then
                INTIMATR_TEST_REPORT_PROFILE_AT_START=1 INTIMATR_TEST_HOOK_STATUS_GATE=1 INTIMATR_TEST_REMOTE_STOP_WITH_HOOKS=1 INTIMATR_TEST_EXTERNAL_TIMER_ARM=1 INTIMATR_TEST_EXTERNAL_RATE_COMMANDS=1 xvfb-run -a wine target/wine-attach/game-fixture/wine-attach-target.exe >target/wine-attach/game-fixture/stdout 2>target/wine-attach/game-fixture/stderr
              fi
              ;;
            *)
              echo "Unexpected Bottles mock arguments: $*" >&2
              exit 2
              ;;
          esac
          MOCK_BOTTLES
          chmod +x target/wine-attach/mocks/bottles-cli
          # Batch, read-only compatibility inspection of registered programs.
          # No Wine process is launched by bottle-compat; this mocked bottle
          # contains valid, incomplete, missing, unsupported and escape paths.
          mkdir -p "$WINEPREFIX/drive_c/Games"
          cp target/wine-attach/wine-attach-target.exe "$WINEPREFIX/drive_c/Games/Full.exe"
          cp target/x86_64-pc-windows-gnu/release/wine-incompatible-target.exe "$WINEPREFIX/drive_c/Games/Partial.exe"
          # Linux supports case-distinct paths that Windows cannot
          # unambiguously distinguish; inventory must fail closed.
          cp "$WINEPREFIX/drive_c/Games/Full.exe" "$WINEPREFIX/drive_c/Games/Overlap.exe"
          cp "$WINEPREFIX/drive_c/Games/Partial.exe" "$WINEPREFIX/drive_c/Games/OVERLAP.EXE"
          # Explicitly mapped external path: Wine's DOS device mapping is
          # the only authority. No host-wide path scan without opt-in.
          external_games="$RUNNER_TEMP/intimatr-external-games"
          mkdir -p "$external_games"
          cp "$WINEPREFIX/drive_c/Games/Full.exe" "$external_games/Full.exe"
          ln -s "$(pwd)/target/wine-attach/wine-attach-target.exe" "$external_games/Escape.exe"
          ln -s "$external_games" "$WINEPREFIX/dosdevices/q:"
          ln -s "$(pwd)/target/wine-attach/wine-attach-target.exe" "$WINEPREFIX/drive_c/Games/Outside.exe"
          cat >target/wine-attach/mocks/compat-programs.json <<'MOCK_COMPAT_PROGRAMS'
          [
            {"name":"Full","executable":"Full.exe","path":"C:\\Games\\Full.exe"},
            {"name":"Mixed-Case Registration","executable":"Full.exe","path":"c:\\gAmEs\\fULL.eXe"},
            {"name":"Mapped External","executable":"Full.exe","path":"Q:\\fULL.eXe"},
            {"name":"Mapped Escape","executable":"Escape.exe","path":"Q:\\Escape.exe"},
            {"name":"Ambiguous Case","executable":"Overlap.exe","path":"C:\\Games\\overlap.exe"},
            {"name":"Partial","executable":"Partial.exe","path":"C:\\Games\\Partial.exe"},
            {"name":"Unavailable","executable":"Absent.exe","path":"C:\\Games\\Absent.exe"},
            {"name":"Other Drive","executable":"Other.exe","path":"Z:\\other\\Other.exe"},
            {"name":"Escaping Link","executable":"Outside.exe","path":"C:\\Games\\Outside.exe"}
          ]
          MOCK_COMPAT_PROGRAMS
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/compat-programs.json"
          target/release/intimatr-bottles bottle-compat \
            --bottle Fixture \
            --bottles-cli target/wine-attach/mocks/bottles-cli >target/wine-attach/bottle-compat.json
          jq -e '.operation == "read_only_registered_bottle_static_pe_compatibility"
            and .external_drive_inspection_opted_in == false
            and .bottle_prefix_association_verified == true
            and .registered_programs_only == true
            and .wine_runner_verified == false
            and .process_identity_verified == false
            and .process_attachment_attempted == false
            and .timer_hook_installation_attempted == false
            and .gameplay_speed_verified == false
            and (.programs | length) == 9
            and ([.programs[] | select(.registered_name == "Mapped External" or .registered_name == "Mapped Escape")
              | select(.resolved_linux_file == null and .static_pe_compatibility.static_import_status == "static_import_inventory_unknown")] | length) == 2
            and ([.programs[] | select(.registered_name == "Mixed-Case Registration"
              and .static_pe_compatibility.static_import_status == "static_four_timer_names_present"
              and (.resolved_linux_file | endswith("/Games/Full.exe")))] | length) == 1
            and ([.programs[] | select(.registered_name == "Ambiguous Case"
              and .resolved_linux_file == null
              and .static_pe_compatibility.static_import_status == "static_import_inventory_unknown"
              and (.static_pe_compatibility.inspection_error | contains("ambiguous case-insensitive")))] | length) == 1
            and ([.programs[] | select(.registered_name == "Full"
              and .static_pe_compatibility.static_import_status == "static_four_timer_names_present")] | length) == 1
            and ([.programs[] | select(.registered_name == "Partial"
              and .static_pe_compatibility.static_import_status == "static_timer_imports_missing"
              and (.static_pe_compatibility.static_timer_imports_missing | index("timeGetTime") != null))] | length) == 1
            and ([.programs[] | select(.registered_name == "Unavailable" or .registered_name == "Other Drive" or .registered_name == "Escaping Link") |
              select(.resolved_linux_file == null and .static_pe_compatibility.static_import_status == "static_import_inventory_unknown")] | length) == 3' target/wine-attach/bottle-compat.json > /dev/null
          target/release/intimatr-bottles bottle-compat \
            --bottle Fixture \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --include-mapped-drives >target/wine-attach/bottle-compat-mapped.json
          jq -e '.external_drive_inspection_opted_in == true
            and .process_attachment_attempted == false
            and .timer_hook_installation_attempted == false
            and (.programs | length) == 9
            and ([.programs[] | select(.registered_name == "Mapped External"
              and .static_pe_compatibility.static_import_status == "static_four_timer_names_present"
              and (.resolved_linux_file | endswith("/intimatr-external-games/Full.exe")))] | length) == 1
            and ([.programs[] | select(.registered_name == "Mapped Escape"
              and .resolved_linux_file == null
              and .static_pe_compatibility.static_import_status == "static_import_inventory_unknown"
              and (.static_pe_compatibility.inspection_error | contains("outside selected mapped drive")))] | length) == 1' target/wine-attach/bottle-compat-mapped.json > /dev/null
          if target/release/intimatr-bottles bottle-compat \
            --bottle Fixture \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --include-mapped-drives --include-mapped-drives >target/wine-attach/bottle-compat-repeat.stdout 2>target/wine-attach/bottle-compat-repeat.stderr; then
            echo "ERROR: read-only scan accepted duplicated external-drive consent" >&2
            exit 1
          fi
          grep -q 'duplicate --include-mapped-drives' target/wine-attach/bottle-compat-repeat.stderr
          if target/release/intimatr-bottles bottle-compat \
            --bottle DoesNotExist \
            --bottles-cli target/wine-attach/mocks/bottles-cli >target/wine-attach/bottle-compat-missing.stdout 2>target/wine-attach/bottle-compat-missing.stderr; then
            echo "ERROR: batch static inspection accepted unregistered bottle" >&2
            exit 1
          fi
          grep -q 'selected bottle not found' target/wine-attach/bottle-compat-missing.stderr
          unset INTIMATR_MOCK_PROGRAMS_JSON
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli > target/wine-attach/live-match.json
          grep -q "\"windows_pid\": $windows_pid" target/wine-attach/live-match.json
          grep -q '"operation": "read_only_live_bottles_wine_match"' target/wine-attach/live-match.json
          grep -q '"bottle_prefix_association_verified": true' target/wine-attach/live-match.json
          # Live matching must NEVER silently choose system Wine for a
          # bottle that may require a patched or external runner.
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/missing-runner.stderr; then
            echo "ERROR: implicit default Wine runner was accepted" >&2
            exit 1
          fi
          grep -q 'missing --runner' target/wine-attach/missing-runner.stderr
          # Explicit Wine selection cannot silently fall back to PATH lookup.
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner wine \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/relative-runner.stderr; then
            echo "ERROR: unpinned PATH Wine runner was accepted" >&2
            exit 1
          fi
          grep -q 'absolute executable path' target/wine-attach/relative-runner.stderr
          grep -q '"runner_binary_verified": true' target/wine-attach/live-match.json
          grep -q '"runner_verified": false' target/wine-attach/live-match.json
          grep -q '"configured_runner_name": "test-wine"' target/wine-attach/live-match.json
          grep -q '"bottle_architecture": "win64"' target/wine-attach/live-match.json
          grep -q '"reason": "managed_or_external_runner_location_unknown"' target/wine-attach/live-match.json
          grep -q '"game_process_identity_verified": false' target/wine-attach/live-match.json
          grep -q '"status": "not_registered_in_selected_bottle"' target/wine-attach/live-match.json
          grep -q '"safe_to_attach": false' target/wine-attach/live-match.json
          grep -q '"attachment_attempted": false' target/wine-attach/live-match.json
          grep -q '"prefix_source": "configured_bottles_root"' target/wine-attach/live-match.json
          # Wrong explicit Wine prefix must fail before the PE helper runs.
          mkdir -p "$RUNNER_TEMP/Other/drive_c"
          if target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --prefix "$RUNNER_TEMP/Other" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/wrong-prefix.stderr; then
            echo "ERROR: mismatched bottle and prefix were accepted" >&2
            exit 1
          fi
          grep -q 'supplied WINEPREFIX is not' target/wine-attach/wrong-prefix.stderr
          echo "Read-only Bottles prefix ownership rejected an unrelated prefix"
          if target/release/intimatr-bottles live-match \
            --bottle Missing \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli 2> target/wine-attach/missing-bottle.stderr; then
            echo "ERROR: a nonexistent bottle was accepted" >&2
            exit 1
          fi
          grep -q 'selected bottle not found' target/wine-attach/missing-bottle.stderr
          echo "Read-only live Bottles/Wine matching verified with mocked native inventory"
          # Reuse the *real running* Wine fixture PID and verified image path,
          # but register its path using mocked Bottles metadata. This tests
          # explicit PID + full-path preflight, never arbitrary attachment.
          observed_path="$(jq -r --argjson pid "$windows_pid" '.processes[] | select(.windows_pid == $pid) | .full_image_path // empty' target/wine-attach/windows-pids.json)"
          test -n "$observed_path"
          jq -n --arg path "$observed_path" '[{
            "name":"Selected offline fixture",
            "executable":"wine-attach-target.exe",
            "path":$path
          }]' > target/wine-attach/mocks/selected-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/selected-programs.json"
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" > target/wine-attach/selected-preflight.json
          jq -e --argjson pid "$windows_pid" '.selected_candidate | select(
            .operation == "read_only_explicit_game_candidate_preflight"
            and .selected_windows_pid == $pid
            and .timer_import_coverage.all_four_static_names == true
            and (.process_creation_time_100ns | type == "string" and length > 0)
            and .pid_observed_in_selected_wineserver_snapshot == true
            and .image_observed_in_selected_wineserver_snapshot == true
            and .registered_identity_verified_at_snapshot == true
            and (.status == "registered_x64_candidate_for_review_only"
                 or .status == "architecture_unverified")
            and .safe_to_attach == false
            and .snapshot_only == true
            and .attachment_attempted == false
          )' target/wine-attach/selected-preflight.json > /dev/null
          # Read-only readiness aggregates prefix/runner/identity evidence.
          # A matching registered x64 fixture is still not a game attach.
          jq -e '.attachment_readiness | select(
            .operation == "read_only_live_game_attachment_readiness"
            and .snapshot_registered_identity_verified == true
            and .timer_import_coverage.all_four_static_names == true
            and (.selected_process_creation_time_100ns | type == "string" and length > 0)
            and .selected_pid_observed_in_prefix_wineserver_snapshot == true
            and .selected_image_observed_in_prefix_wineserver_snapshot == true
            and .bottle_prefix_verified == true
            and .configured_runner_verified == false
            and .safe_to_attach == false
            and .attachment_attempted == false
            and (.blockers | index("configured_wine_runner_unverified") != null)
            and (.blockers | index("live_process_prefix_ownership_unverified") != null)
            and (.blockers | index("production_game_loader_field_verification_missing") != null)
          )' target/wine-attach/selected-preflight.json > /dev/null
          # A native managed runner is stored in XDG_DATA_HOME/bottles/runners,
          # NOT a guessed sibling of the selected bottle's prefix.
          managed_home="$RUNNER_TEMP/intimatr-managed-xdg"
          mkdir -p "$managed_home/bottles/runners/test-wine/bin"
          ln -s "$(command -v wine)" "$managed_home/bottles/runners/test-wine/bin/wine"
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" > target/wine-attach/managed-runner.json
          jq -e '.runner_verified == true
              and .runner_binary_verified == true
              and .runner_audit.reason == "native_managed_runner_binary_matched"
              and .attachment_readiness.configured_runner_verified == true
              and .safe_to_attach == false
              and .attachment_attempted == false' target/wine-attach/managed-runner.json > /dev/null
          # A different existing executable is rejected before Wine is run.
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner /usr/bin/false \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe "$observed_path" 2> target/wine-attach/wrong-managed-runner.stderr; then
            echo "ERROR: unrelated managed Wine runner binary was accepted" >&2
            exit 1
          fi
          grep -q 'differs from the configured managed Bottles runner' target/wine-attach/wrong-managed-runner.stderr
          # Neither a recycled/missing PID nor a different full executable
          # path may be promoted to an identity match.
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid 4294967295 --exe "$observed_path" > target/wine-attach/missing-pid-preflight.json
          jq -e '.selected_candidate | select(
            .status == "selected_pid_not_in_snapshot"
            and .pid_observed_in_selected_wineserver_snapshot == false
            and .image_observed_in_selected_wineserver_snapshot == false
            and .registered_identity_verified_at_snapshot == false
            and .safe_to_attach == false
          )' target/wine-attach/missing-pid-preflight.json > /dev/null
          target/release/intimatr-bottles live-match \
            --bottle Fixture \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            --pid "$windows_pid" --exe 'C:\\Different\\Wrong.exe' > target/wine-attach/wrong-path-preflight.json
          jq -e '.selected_candidate | select(
            .status == "selected_executable_does_not_match_pid"
            and .pid_observed_in_selected_wineserver_snapshot == true
            and .image_observed_in_selected_wineserver_snapshot == false
            and .registered_identity_verified_at_snapshot == false
            and .safe_to_attach == false
          )' target/wine-attach/wrong-path-preflight.json > /dev/null
          jq -e '.attachment_readiness | select(
            .snapshot_registered_identity_verified == false
            and .status == "candidate_identity_or_architecture_unverified"
            and .safe_to_attach == false
            and (.blockers | index("selected_pid_executable_registration_unverified") != null)
          )' target/wine-attach/missing-pid-preflight.json > /dev/null
          jq -e '.attachment_readiness | select(
            .snapshot_registered_identity_verified == false
            and .status == "candidate_identity_or_architecture_unverified"
            and .safe_to_attach == false
            and (.blockers | index("selected_pid_executable_registration_unverified") != null)
          )' target/wine-attach/wrong-path-preflight.json > /dev/null
          unset INTIMATR_MOCK_PROGRAMS_JSON
          echo "Verified explicit Windows PID/full-image preflight and blocked game readiness against isolated Wine fixture"
          # A same-named executable in a DIFFERENT directory is not the
          # owned fixture beside wine-attach-helper.exe, even when it is
          # genuinely running under the same Wine prefix.
          mkdir -p target/wine-attach/decoy
          cp target/wine-attach/wine-attach-target.exe target/wine-attach/decoy/
          xvfb-run -a wine target/wine-attach/decoy/wine-attach-target.exe > target/wine-attach/decoy/stdout 2> target/wine-attach/decoy/stderr &
          decoy_launcher=$!
          trap 'kill "$launcher_pid" "$decoy_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if test -s target/wine-attach/decoy/attach-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/decoy/attach-target.pid
          decoy_pid="$(cat target/wine-attach/decoy/attach-target.pid)"
          test "$decoy_pid" != "$windows_pid"
          if target/release/intimatr-bottles probe-attach \
            --pid "$decoy_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/decoy-attach.stdout 2> target/wine-attach/decoy-attach.stderr; then
            echo "ERROR: unrelated same-basename Wine process received an attach" >&2
            exit 1
          fi
          grep -q "target is not the helper's owned Wine fixture" target/wine-attach/decoy-attach.stderr
          kill "$decoy_launcher" 2>/dev/null || true
          wait "$decoy_launcher" || true
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          echo "Wine fixture-only loader rejected a distinct same-named process"
          # Never fall back to the system Wine binary, even in fixture-only
          # remote-attach mode: a real Bottles prefix may use another runner.
          if target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe > target/wine-attach/missing-attach-runner.stdout 2> target/wine-attach/missing-attach-runner.stderr; then
            echo "ERROR: fixture remote attach accepted an implicit Wine runner" >&2
            exit 1
          fi
          grep -q 'missing --runner' target/wine-attach/missing-attach-runner.stderr
          echo "Wine fixture-only loader requires explicit runner selection"
          # Two distinct Linux invocations launch separate Windows helpers
          # against the same already-running fixture. Exactly one may load.
          target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/race-1.stdout 2> target/wine-attach/race-1.stderr &
          contender_one=$!
          target/release/intimatr-bottles probe-attach \
            --pid "$windows_pid" \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-attach-helper.exe \
            --runner "$(command -v wine)" > target/wine-attach/race-2.stdout 2> target/wine-attach/race-2.stderr &
          contender_two=$!
          if wait "$contender_one"; then success_one=1; else success_one=0; fi
          if wait "$contender_two"; then success_two=1; else success_two=0; fi
          if test $((success_one + success_two)) -ne 1; then
            echo "ERROR: expected exactly one remote attach success" >&2
            cat target/wine-attach/race-1.stderr target/wine-attach/race-2.stderr >&2
            exit 1
          fi
