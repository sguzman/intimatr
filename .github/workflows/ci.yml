name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build x86_64 Windows DLL
        run: cargo build --release --lib --target x86_64-pc-windows-msvc

      - name: Verify DLL artifact
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/intimatr.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "Expected DLL artifact was not produced: $dll"
          }
          $item = Get-Item $dll
          if ($item.Length -le 0) {
            throw "DLL artifact is empty: $dll"
          }
          Write-Host "Verified $dll ($($item.Length) bytes)"

      - name: Package release layout smoke test
        shell: pwsh
        run: |
          $zip = & ./scripts/package-release.ps1 -Version "ci-${{ github.run_number }}"
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "Packaging smoke test did not produce an archive: $zip"
          }
          Write-Host "Verified release package $zip"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/intimatr.dll
          if-no-files-found: error
