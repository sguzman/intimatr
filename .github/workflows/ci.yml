          fi
          grep -q 'no active four-timer IAT hooks' target/wine-attach/game-rate-after-stop.stderr
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles step-game-speed "${game_args[@]}" --offline-single-player --experimental-four-timers --action increase >target/wine-attach/game-step-after-stop.stdout 2>target/wine-attach/game-step-after-stop.stderr; then
            echo "ERROR: speed-state action succeeded after shutdown" >&2
            exit 1
          fi
          grep -q 'no active four-timer IAT hooks' target/wine-attach/game-step-after-stop.stderr
          # Repeated stop is idempotent; never free a still-referenced DLL.
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles stop-game "${game_args[@]}" --offline-single-player > target/wine-attach/game-stopped-again.json
          jq -e '.runtime_stopped_verified == true and .intimatr_module_unloaded == false' target/wine-attach/game-stopped-again.json > /dev/null
          touch target/wine-attach/game-fixture/attach-release.flag
          if ! wait "$game_launcher"; then
            echo "ERROR: mocked Bottles game process did not exit cleanly" >&2
            echo "Disposable Wine target stdout:" >&2
            sed -n '1,100p' target/wine-attach/game-fixture/stdout >&2 || true
            echo "Disposable Wine target stderr:" >&2
            sed -n '1,100p' target/wine-attach/game-fixture/stderr >&2 || true
            exit 1
          fi
          jq -e '.operation == "explicit_registered_bottles_profile_launch"
            and .source_game_policy_verified == true
            and .profile_file_matching_source_verified == true
            and .bottles_run_cli_exited_successfully == true
            and .game_process_started_verified == false
            and .profile_reached_game_verified == false
            and .dll_auto_loaded == false
            and .bottle_configuration_modified == false
            and .attachment_attempted == false' \
            target/wine-attach/profile-launch-report.json > /dev/null
          trap - EXIT
          unset INTIMATR_MOCK_PROGRAMS_JSON INTIMATR_MOCK_LAUNCH_WINE_CHILD
          echo "Mocked Bottles launch reached Windows fixture; native CLI then attached exact DLL and verified four scaled timers"
          # An explicitly disabled profile is a veto, not permission to
          # fall back to default speed steps. Use a second isolated compatible
          # PE so timer activation failure is caused by profile rejection,
          # not by missing main-image timer imports.
          mkdir -p target/wine-attach/rejected
          cp target/x86_64-pc-windows-gnu/release/wine-attach-target.exe target/wine-attach/rejected/
          cat >"$WINEPREFIX/drive_c/intimatr-ci-disabled.toml" <<'DISABLED_SPEED_PROFILE'
          version = 1
          [speed]
          enabled = false
          DISABLED_SPEED_PROFILE
          INTIMATR_SPEED_PROFILE='C:\intimatr-ci-disabled.toml' \
            INTIMATR_TEST_REJECTED_PROFILE_ONLY=1 \
            xvfb-run -a wine target/wine-attach/rejected/wine-attach-target.exe \
            >target/wine-attach/rejected/stdout 2>target/wine-attach/rejected/stderr &
          rejected_launcher=$!
          trap 'kill "$rejected_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do
            if test -s target/wine-attach/rejected/attach-target.pid; then break; fi
            sleep 0.1
          done
          test -s target/wine-attach/rejected/attach-target.pid
          rejected_pid="$(cat target/wine-attach/rejected/attach-target.pid)"
          target/release/intimatr-bottles win-processes \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" >target/wine-attach/rejected/snapshot.json
          rejected_image="$(jq -r --argjson pid "$rejected_pid" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-attach/rejected/snapshot.json)"
          rejected_created="$(jq -r --argjson pid "$rejected_pid" '[.processes[] | select(.windows_pid == $pid) | .process_creation_time_100ns // empty] | first // empty' target/wine-attach/rejected/snapshot.json)"
          test -n "$rejected_image" && test -n "$rejected_created" && test "$rejected_created" != 0
          jq -n --arg path "$rejected_image" '[{
            "name":"Disabled speed profile offline fixture",
            "executable":"wine-attach-target.exe",
            "path":$path
          }]' >target/wine-attach/mocks/rejected-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/rejected-programs.json"
          rejected_args=(
            --bottle Fixture
            --helper target/wine-attach/wine-process-list.exe
            --attach-helper "$(pwd)/target/wine-attach/wine-game-attach-helper.exe"
            --runner "$(command -v wine)"
            --bottles-cli target/wine-attach/mocks/bottles-cli
            --pid "$rejected_pid" --exe "$rejected_image"
            --created-100ns "$rejected_created"
          )
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game \
            "${rejected_args[@]}" --offline-single-player >target/wine-attach/rejected/attached.json
          jq -e '.runtime_running_verified == true
            and .speed_controls_verified == false' target/wine-attach/rejected/attached.json > /dev/null
          for i in $(seq 1 150); do
            if test -s target/wine-attach/rejected/attach-rejected-profile-ready.flag; then break; fi
            sleep 0.1
          done
          test -s target/wine-attach/rejected/attach-rejected-profile-ready.flag
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game \
            "${rejected_args[@]}" --offline-single-player >target/wine-attach/rejected/status.json
          jq -e '.runtime_state == "running"
            and .target_speed_profile_state == "rejected_or_disabled"
            and .explicit_speed_profile_accepted_in_target == false
            and .target_speed_profile_sha256 == null
            and .profile_contents_match_verified == false
            and .main_image_four_timer_imports_present == true
            and .timer_hook_state == "none"
            and .installed_virtual_clock_multiplier == null' target/wine-attach/rejected/status.json > /dev/null
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers \
            "${rejected_args[@]}" --offline-single-player --experimental-four-timers \
            >target/wine-attach/rejected/arm.stdout 2>target/wine-attach/rejected/arm.stderr; then
            echo "ERROR: disabled explicit profile unexpectedly armed four timers" >&2
            exit 1
          fi
          grep -q 'timer activation rejected' target/wine-attach/rejected/arm.stderr
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game \
            "${rejected_args[@]}" --offline-single-player >target/wine-attach/rejected/after-arm-rejection.json
          jq -e '.runtime_state == "running"
            and .target_speed_profile_state == "rejected_or_disabled"
            and .timer_hook_state == "none"
            and .timer_hooks_installed_verified == false
            and .installed_virtual_clock_multiplier == null' target/wine-attach/rejected/after-arm-rejection.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles stop-game \
            "${rejected_args[@]}" --offline-single-player >target/wine-attach/rejected/stopped.json
          jq -e '.runtime_stopped_verified == true
            and .intimatr_module_unloaded == false' target/wine-attach/rejected/stopped.json > /dev/null
          if ! wait "$rejected_launcher"; then
            echo "ERROR: disabled-profile Wine target failed to exit cleanly" >&2
            sed -n '1,100p' target/wine-attach/rejected/stdout >&2 || true
            sed -n '1,100p' target/wine-attach/rejected/stderr >&2 || true
            exit 1
          fi
          trap - EXIT
          unset INTIMATR_MOCK_PROGRAMS_JSON
          echo "Disabled explicit speed profile verified: DLL running, four timer hooks refused, clean stop"

          # Deliberately incompatible executable: WinMM is available via
          # LoadLibrary, but timeGetTime is not imported in the main PE IAT.
          # It must be rejected by both independent preflights, without any
          # timer patch or claim of game-speed compatibility.
          mkdir -p target/wine-attach/incompatible
          cp target/x86_64-pc-windows-gnu/release/wine-incompatible-target.exe target/wine-attach/incompatible/
          # Existing Intimatr bootstrap loads config from the DLL directory,
          # not the selected game image directory. Do not silently add a
          # fixture-only fallback: this must match production path semantics.
          cp config/wine-incompatible-target.exe.toml target/wine-attach/config/
          xvfb-run -a wine target/wine-attach/incompatible/wine-incompatible-target.exe >target/wine-attach/incompatible/stdout 2>target/wine-attach/incompatible/stderr &
          incompatible_launcher=$!
          trap 'kill "$incompatible_launcher" 2>/dev/null || true' EXIT
          for i in $(seq 1 150); do
            if test -s target/wine-attach/incompatible/incompatible-target.pid; then
              break
            fi
            sleep 0.1
          done
          test -s target/wine-attach/incompatible/incompatible-target.pid
          incompatible_pid="$(cat target/wine-attach/incompatible/incompatible-target.pid)"
          target/release/intimatr-bottles win-processes \
            --prefix "$WINEPREFIX" \
            --helper target/wine-attach/wine-process-list.exe \
            --runner "$(command -v wine)" >target/wine-attach/incompatible/snapshot.json
          jq -e --argjson pid "$incompatible_pid" '
            [.processes[] | select(.windows_pid == $pid)] | length == 1' target/wine-attach/incompatible/snapshot.json > /dev/null
          jq -e --argjson pid "$incompatible_pid" '
            [.processes[] | select(.windows_pid == $pid) |
              .timer_import_coverage |
              select(.all_four_static_names == false and .time_get_time == false)] |
            length == 1' target/wine-attach/incompatible/snapshot.json > /dev/null
          incompatible_image="$(jq -r --argjson pid "$incompatible_pid" '[.processes[] | select(.windows_pid == $pid) | .full_image_path // empty] | first // empty' target/wine-attach/incompatible/snapshot.json)"
          incompatible_created="$(jq -r --argjson pid "$incompatible_pid" '[.processes[] | select(.windows_pid == $pid) | .process_creation_time_100ns // empty] | first // empty' target/wine-attach/incompatible/snapshot.json)"
          test -n "$incompatible_image" && test -n "$incompatible_created" && test "$incompatible_created" != 0
          jq -n --arg path "$incompatible_image" '[{
            "name":"Incompatible offline timer test fixture",
            "executable":"wine-incompatible-target.exe",
            "path":$path
          }]' >target/wine-attach/mocks/incompatible-programs.json
          export INTIMATR_MOCK_PROGRAMS_JSON="$(pwd)/target/wine-attach/mocks/incompatible-programs.json"
          incompatible_args=(
            --bottle Fixture
            --helper target/wine-attach/wine-process-list.exe
            --attach-helper "$(pwd)/target/wine-attach/wine-game-attach-helper.exe"
            --runner "$(command -v wine)"
            --bottles-cli target/wine-attach/mocks/bottles-cli
            --pid "$incompatible_pid" --exe "$incompatible_image"
            --created-100ns "$incompatible_created"
          )
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${incompatible_args[@]}" --offline-single-player >target/wine-attach/incompatible/before.json
          jq -e '.intimatr_module_loaded == false
            and .runtime_state == "absent"
            and .target_speed_profile_state == "unavailable"
            and .timer_hook_state == "none"
            and .main_image_four_timer_imports_present == null
            and .static_pe_timer_import_coverage.time_get_time == false' target/wine-attach/incompatible/before.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles attach-game "${incompatible_args[@]}" --offline-single-player >target/wine-attach/incompatible/attached.json
          jq -e '.runtime_running_verified == true and .speed_controls_verified == false' target/wine-attach/incompatible/attached.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${incompatible_args[@]}" --offline-single-player >target/wine-attach/incompatible/unarmed.json
          jq -e '.runtime_state == "running"
            and .target_speed_profile_state == "absent"
            and .explicit_speed_profile_accepted_in_target == false
            and .timer_hook_state == "none"
            and .installed_virtual_clock_multiplier == null
            and .main_image_four_timer_imports_present == false
            and (.main_image_timer_imports_missing | index("timeGetTime") != null)
            and .static_pe_timer_import_coverage.all_four_static_names == false' target/wine-attach/incompatible/unarmed.json > /dev/null
          if XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles arm-game-timers "${incompatible_args[@]}" --offline-single-player --experimental-four-timers >target/wine-attach/incompatible/arm.stdout 2>target/wine-attach/incompatible/arm.stderr; then
            echo "ERROR: static preflight armed incompatible timer IAT" >&2
            exit 1
          fi
          grep -q 'static PE is missing imports:.*timeGetTime' target/wine-attach/incompatible/arm.stderr
          grep -q 'no remote helper launched' target/wine-attach/incompatible/arm.stderr
          # Try the dedicated exact-identity helper directly: it cannot
          # bypass the separate in-memory import preflight either.
          if wine target/wine-attach/wine-game-attach-helper.exe \
            --pid "$incompatible_pid" --exe "$incompatible_image" \
            --created-100ns "$incompatible_created" --offline-single-player \
            --arm-four-timers-only --experimental-four-timers \
            >target/wine-attach/incompatible/direct-arm.stdout 2>target/wine-attach/incompatible/direct-arm.stderr; then
            echo "ERROR: runtime preflight armed incompatible timer IAT" >&2
            exit 1
          fi
          grep -q 'main executable is missing timer imports:.*timeGetTime' target/wine-attach/incompatible/direct-arm.stderr
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles status-game "${incompatible_args[@]}" --offline-single-player >target/wine-attach/incompatible/after-reject.json
          jq -e '.runtime_state == "running"
            and .timer_hook_state == "none"
            and .timer_hooks_installed_verified == false
            and .installed_virtual_clock_multiplier == null
            and (.main_image_timer_imports_missing | index("timeGetTime") != null)' target/wine-attach/incompatible/after-reject.json > /dev/null
          XDG_DATA_HOME="$managed_home" target/release/intimatr-bottles stop-game "${incompatible_args[@]}" --offline-single-player >target/wine-attach/incompatible/stopped.json
          jq -e '.runtime_stopped_verified == true' target/wine-attach/incompatible/stopped.json > /dev/null
          touch target/wine-attach/incompatible/incompatible-release.flag
          wait "$incompatible_launcher"
          trap - EXIT
          unset INTIMATR_MOCK_PROGRAMS_JSON
          echo "Verified static and live timer-import refusal and clean stop for incompatible Wine executable"


  # Build a Windows PE DLL on a Linux host. This is the artifact Wine will
  # eventually load into an opted-in game process; it is not a Linux .so.
  linux-wine-cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Verify portable virtual-clock core on Linux
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib speed
          cargo test --locked --lib bottles
          cargo test --locked --test speed_invariants
          cargo test --locked --bin intimatr-bottles

      - name: Build native Linux Bottles inventory CLI
        run: |
          cargo build --locked --release --bin intimatr-bottles
          test -s target/release/intimatr-bottles
          file target/release/intimatr-bottles | grep -q 'ELF 64-bit'

      - name: Verify read-only global bottle game precedence in Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          target/release/intimatr-bottles profile-check \
            --config config/speed-overrides.example.toml \
            --bottle Games \
            --exe 'c:/games/offline.exe' > target/intimatr-profile-qa.json
          grep -q '"operation": "read_only_profile_resolution"' target/intimatr-profile-qa.json
          grep -q '"matched_game": true' target/intimatr-profile-qa.json
          grep -q '"initial_multiplier": 2.0' target/intimatr-profile-qa.json
          grep -q '"attachment_attempted": false' target/intimatr-profile-qa.json
          target/release/intimatr-bottles profile-check \
            --config config/speed-overrides.example.toml \
            --bottle Online \
            --exe 'C:\Games\Network.exe' > target/intimatr-profile-excluded.json
          grep -q '"excluded": true' target/intimatr-profile-excluded.json
          grep -q '"enabled": false' target/intimatr-profile-excluded.json

      - name: Verify read-only Linux PID inventory and explicit Wine PID uncertainty
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(pwd)/target/intimatr-proc-qa-fixture"
          mkdir -p "$prefix/drive_c"
          WINEPREFIX="$prefix" sleep 20 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            target/release/intimatr-bottles processes --prefix "$prefix" > target/intimatr-processes.json
            if grep -q "\"linux_pid\": $fixture_pid" target/intimatr-processes.json; then
              break
            fi
            sleep 0.1
          done
          grep -q "\"linux_pid\": $fixture_pid" target/intimatr-processes.json
          grep -q '"windows_pid": null' target/intimatr-processes.json
          grep -q '"safe_to_attach": false' target/intimatr-processes.json
          grep -q '"attachment_attempted": false' target/intimatr-processes.json
          echo "Verified Linux prefix process discovery without Windows PID guessing"
          kill "$fixture_pid" 2>/dev/null || true
          wait "$fixture_pid" || true
          trap - EXIT

      - name: Verify read-only Bottles registered game and Wine PID path correlation
        shell: bash
        run: |
          set -euo pipefail
          target/release/intimatr-bottles match-snapshot \
            --bottle Offline \
            --programs config/match-registered.example.json \
            --windows config/match-wine-processes.example.json > target/intimatr-match-report.json
          grep -q '"operation": "read_only_wine_registered_program_matching"' target/intimatr-match-report.json
          grep -q '"windows_pid": 42' target/intimatr-match-report.json
          grep -q '"registered_program_name": "Verified offline"' target/intimatr-match-report.json
          grep -q '"status": "image_path_unknown"' target/intimatr-match-report.json
          grep -q '"safe_to_attach": false' target/intimatr-match-report.json
          jq -e '.matches[] | select(
            .windows_pid == 44 and .status == "unsupported_x64_dll_architecture"
            and .x64_dll_compatible == false
            and .registered_program_name == null and .safe_to_attach == false
          )' target/intimatr-match-report.json > /dev/null
          grep -q '"attachment_attempted": false' target/intimatr-match-report.json

      - name: Strict Clippy for Windows GNU target from Linux
        run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings

      - name: Cross-build Wine-target Windows DLL on Linux
        run: cargo build --locked --release --lib --target x86_64-pc-windows-gnu

      - name: Cross-build read-only Windows PID probe and explicit game attach helper
        run: cargo build --locked --release --bin wine-process-list --bin wine-game-attach-helper --target x86_64-pc-windows-gnu

      - name: Verify read-only Windows PID probe PE artifact
        shell: bash
        run: |
          set -euo pipefail
          probe="target/x86_64-pc-windows-gnu/release/wine-process-list.exe"
          test -s "$probe"
          file "$probe" | grep -Eq 'PE32[+].*x86-64'
          helper="target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe"
          test -s "$helper"
          file "$helper" | grep -Eq 'PE32[+].*x86-64'

      - name: Cross-build Windows speed RPC client for Wine
        run: cargo build --locked --release --bin intimatr-speed --target x86_64-pc-windows-gnu

      - name: Verify Windows Wine speed client PE artifact
        shell: bash
        run: |
          set -euo pipefail
          client="target/x86_64-pc-windows-gnu/release/intimatr-speed.exe"
          test -s "$client"
          file "$client" | grep -Eq 'PE32[+].*x86-64'
          sha256sum "$client"

      - name: Verify Windows PE x86-64 DLL artifact
        shell: bash
        run: |
          set -euo pipefail
          dll="target/x86_64-pc-windows-gnu/release/intimatr.dll"
          test -s "$dll"
          file "$dll"
          file "$dll" | grep -Eq 'PE32[+].*DLL.*x86-64'
          x86_64-w64-mingw32-objdump -f "$dll"
          sha256sum "$dll"

      - name: Package and verify combined Linux/Wine release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="ci-${{ github.run_number }}"
          archive="$(bash scripts/package-linux-release.sh "$version")"
          bash scripts/verify-linux-release.sh "$archive" "$version"

      - name: Upload verified Linux/Wine bundle and archive checksum
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-linux-wine-bundle-x86_64-${{ github.sha }}
          path: |
            dist/intimatr-linux-wine-x86_64-*.tar.gz
            dist/intimatr-linux-wine-x86_64-*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Linux-cross-built Windows DLL
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-wine-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/intimatr.dll
          if-no-files-found: error

      - name: Upload explicit offline Wine game helper
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-game-attach-helper-wine-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/wine-game-attach-helper.exe
          if-no-files-found: error

      - name: Upload read-only Wine Windows PID probe
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-wine-process-list-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/wine-process-list.exe
          if-no-files-found: error

      - name: Upload Linux-cross-built Windows speed RPC client
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-speed-wine-windows-x86_64-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/intimatr-speed.exe
          if-no-files-found: error

      - name: Upload native Linux Bottles inventory CLI
        uses: actions/upload-artifact@v7
        with:
          name: intimatr-bottles-linux-x86_64-${{ github.sha }}
          path: target/release/intimatr-bottles
          if-no-files-found: error
