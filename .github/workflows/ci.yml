          # game helper is NOT limited to the fixture helper's adjacent EXE.
          # This is still our own PE fixture, never an actual installed game.
          mkdir -p target/wine-attach/game-fixture/config
          cp target/wine-attach/wine-attach-target.exe target/wine-attach/game-fixture/
          cp config/wine-attach-target.exe.toml target/wine-attach/game-fixture/config/
          # Resolve a real global -> bottle -> exact-game policy on the
          # native Linux side BEFORE this disposable process launches.
          # The DLL itself consumes only the resolved override-free TOML
          # through its explicit Windows-visible environment variable.
          # We know this isolated Wine prefix exposes the fixture via Z:.
          # An actual Bottles integration must independently verify its
          # selected prefix/drive mapping rather than guessing Z:.
          game_fixture_windows="Z:$(pwd)/target/wine-attach/game-fixture/wine-attach-target.exe"
          cat >target/wine-attach/host-speed-rules.toml <<GAME_SPEED_RULES
          version = 1
          [speed]
          enabled = false
          [[bottles]]
          name = "Fixture"
          [bottles.speed]
          enabled = true
          initial_multiplier = 1.5
          [[games]]
          bottle = "Fixture"
          path = '$game_fixture_windows'
          [games.speed]
          initial_multiplier = 2.0
          steps = [0.25, 0.5, 0.75, 1.0, 1.001, 1.5, 1.75, 2.0, 3.0, 5.0, 10.0]
          GAME_SPEED_RULES
          mkdir -p "$WINEPREFIX/drive_c"
          target/release/intimatr-bottles profile-export \
            --config "$(pwd)/target/wine-attach/host-speed-rules.toml" \
            --bottle Fixture --exe "$game_fixture_windows" \
            --output "$WINEPREFIX/drive_c/intimatr-ci-speed.toml" \
            >target/wine-attach/launch-profile-export.json
          jq -e '.operation == "explicit_launch_profile_export"
            and .resolved_speed_enabled == true
            and .override_rules_in_output == 0
            and .attachment_attempted == false
            and .running_process_environment_modified == false' \
            target/wine-attach/launch-profile-export.json > /dev/null
          grep -q 'initial_multiplier = 2.0' "$WINEPREFIX/drive_c/intimatr-ci-speed.toml"
          if grep -q '\[\[games\]\]' "$WINEPREFIX/drive_c/intimatr-ci-speed.toml"; then
            echo "ERROR: exported DLL profile retained game overrides" >&2
            exit 1
          fi
          if target/release/intimatr-bottles profile-export \
            --config "$(pwd)/target/wine-attach/host-speed-rules.toml" \
            --bottle Fixture --exe "$game_fixture_windows" \
            --output "$WINEPREFIX/drive_c/intimatr-ci-speed.toml" \
            >target/wine-attach/reexport.stdout 2>target/wine-attach/reexport.stderr; then
            echo "ERROR: profile-export overwrote an existing launch profile" >&2
            exit 1
          fi
          grep -q 'refusing overwrite' target/wine-attach/reexport.stderr
          # Resolve the already-exported profile through the selected native
          # Bottles C: prefix, never an assumed Z: mapping.
          target/release/intimatr-bottles profile-path \
            --bottle Fixture \
            --profile "$WINEPREFIX/drive_c/intimatr-ci-speed.toml" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            >target/wine-attach/launch-profile-path.json
          jq -e '.operation == "read_only_verified_bottle_profile_path"
            and .bottle_prefix_association_verified == true
            and .profile_validated == true
            and .speed_enabled == true
            and .windows_profile_path == "C:\\intimatr-ci-speed.toml"
            and .running_process_environment_modified == false
            and .runner_verified == false
            and .attachment_attempted == false' \
            target/wine-attach/launch-profile-path.json > /dev/null
          if target/release/intimatr-bottles profile-path \
            --bottle Fixture \
            --profile "$(pwd)/target/wine-attach/host-speed-rules.toml" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            >target/wine-attach/outside-profile.stdout 2>target/wine-attach/outside-profile.stderr; then
            echo "ERROR: profile-path accepted a source file outside selected C: drive" >&2
            exit 1
          fi
          ln -s "$(pwd)/target/wine-attach/host-speed-rules.toml" "$WINEPREFIX/drive_c/escape-speed.toml"
          if target/release/intimatr-bottles profile-path \
            --bottle Fixture \
            --profile "$WINEPREFIX/drive_c/escape-speed.toml" \
            --bottles-cli target/wine-attach/mocks/bottles-cli \
            >target/wine-attach/symlink-profile.stdout 2>target/wine-attach/symlink-profile.stderr; then
            echo "ERROR: profile-path accepted symlinked profile" >&2
            exit 1
          fi
