name: Fix Milestone 6 Clippy

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor pointer scan helper and test config
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/analysis.rs")
          text = path.read_text()

          old_call = '''        let candidates = scan_pointer_predecessors(
              source,
              current_target,
              filter,
              scanner_config.chunk_size_bytes,
              options.pointer_size,
              options.alignment,
              options.max_offset,
              options.max_results.saturating_sub(results.len()),
          )?;'''
          new_call = '''        let predecessor_options = PointerPredecessorScanOptions {
              filter,
              configured_chunk_size: scanner_config.chunk_size_bytes,
              pointer_size: options.pointer_size,
              alignment: options.alignment,
              max_offset: options.max_offset,
              max_results: options.max_results.saturating_sub(results.len()),
          };
          let candidates =
              scan_pointer_predecessors(source, current_target, predecessor_options)?;'''
          if old_call not in text:
              raise SystemExit("pointer predecessor call marker missing")
          text = text.replace(old_call, new_call, 1)

          old_fn = '''fn scan_pointer_predecessors<S: MemorySource + ?Sized>(
              source: &S,
              target: u64,
              filter: RegionFilter,
              configured_chunk_size: usize,
              pointer_size: u8,
              alignment: usize,
              max_offset: u64,
              max_results: usize,
          ) -> Result<Vec<(u64, i64)>, AnalysisError> {
              let width = pointer_size as usize;
              let chunk_size = configured_chunk_size.max(width);'''
          new_fn = '''#[derive(Debug, Clone, Copy)]
          struct PointerPredecessorScanOptions {
              filter: RegionFilter,
              configured_chunk_size: usize,
              pointer_size: u8,
              alignment: usize,
              max_offset: u64,
              max_results: usize,
          }

          fn scan_pointer_predecessors<S: MemorySource + ?Sized>(
              source: &S,
              target: u64,
              options: PointerPredecessorScanOptions,
          ) -> Result<Vec<(u64, i64)>, AnalysisError> {
              let width = options.pointer_size as usize;
              let chunk_size = options.configured_chunk_size.max(width);'''
          if old_fn not in text:
              raise SystemExit("pointer predecessor function marker missing")
          text = text.replace(old_fn, new_fn, 1)

          replacements = [
              ("region.is_scannable(filter)", "region.is_scannable(options.filter)"),
              ("% alignment != 0", "% options.alignment != 0"),
              ("if pointer_size == 4", "if options.pointer_size == 4"),
              ("if delta <= max_offset && delta <= i64::MAX as u64", "if delta <= options.max_offset && delta <= i64::MAX as u64"),
              ("if results.len() >= max_results", "if results.len() >= options.max_results"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"analysis replacement marker missing: {old}")
              text = text.replace(old, new, 1)

          old_test = '''        let mut config = ScannerConfig::default();
              config.chunk_size_bytes = 4;'''
          new_test = '''        let config = ScannerConfig {
              chunk_size_bytes: 4,
              ..ScannerConfig::default()
          };'''
          if old_test not in text:
              raise SystemExit("scanner config test marker missing")
          text = text.replace(old_test, new_test, 1)

          path.write_text(text)
          '@ | python -
          cargo fmt --all
          git diff --check -- src/analysis.rs
      - name: Commit refactor and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone6-fix-clippy.yml
          git add src/analysis.rs
          git commit -m "refactor pointer scan helper for strict clippy"
          git push origin HEAD:milestone-6-analysis
