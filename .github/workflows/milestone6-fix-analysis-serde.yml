name: Repair Milestone 6 Analysis Serde

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair CommandResult payload field
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/command.rs")
          text = path.read_text()
          old = "    Analysis {\n        result: crate::analysis::AnalysisResult,\n    },"
          new = "    Analysis {\n        analysis: crate::analysis::AnalysisResult,\n    },"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one colliding Analysis result field, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          '@ | python -
          cargo fmt --all
          git diff --check -- src/command.rs
          git diff --quiet -- src/command.rs
          if ($LASTEXITCODE -eq 0) { throw "src/command.rs did not change" }
      - name: Commit repair and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone6-fix-analysis-serde.yml
          git add src/command.rs
          git diff --cached --stat
          git commit -m "fix analysis RPC result serialization"
          git push origin HEAD:milestone-6-analysis
