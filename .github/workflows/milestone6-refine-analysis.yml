name: Refine Milestone 6 Analysis

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply refinements
        shell: pwsh
        run: |
          python scripts/refine_analysis.py
          cargo fmt --all
      - name: Commit refinements
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/analysis.rs src/command.rs
          git commit -m "refine module-relative analysis addresses"
          git push origin HEAD:milestone-6-analysis
