name: Apply Verified Pointer Helper Refactor

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor analysis source
        shell: pwsh
        run: |
          python scripts/refactor_analysis_clippy.py
          cargo fmt --all
          $status = git status --porcelain -- src/analysis.rs
          if (-not $status) { throw "src/analysis.rs is not dirty after refactor" }
          git diff --check -- src/analysis.rs
      - name: Commit verified refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone6-refactor-pointer-helper.yml scripts/refactor_analysis_clippy.py
          git add src/analysis.rs
          git diff --cached --name-status
          git commit -m "refactor pointer scan helper for strict clippy"
          git push origin HEAD:milestone-6-analysis
