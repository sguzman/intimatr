name: Apply Milestone 7 Patch

on:
  push:
    branches:
      - milestone-7-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply patch
        shell: pwsh
        run: |
          python .github/scripts/milestone7_patch.py
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          git diff --check

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone7-integrate-hardening.yml
          git rm .github/workflows/milestone7-apply-patch.yml
          git rm .github/scripts/milestone7_patch.py
          git add src/config.rs src/scanner/engine.rs src/analysis.rs src/logging.rs src/rpc/server.rs src/runtime.rs config/ExampleGame.exe.toml
          git diff --cached --name-status
          git commit -m "integrate bounded runtime hardening"
          git push origin HEAD:milestone-7-hardening
