name: Wire Milestone 6 Analysis

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire analysis
        shell: pwsh
        run: |
          $path = "scripts/wire_analysis.py"
          $text = Get-Content $path -Raw
          $text = $text.Replace('ScanSession>>,","', 'ScanSession>>,",')
          Set-Content $path $text
          python scripts/wire_analysis.py
          cargo fmt --all
      - name: Commit wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/analysis.rs src/command.rs src/runtime.rs
          git commit -m "wire advanced analysis into shared commands"
          git push origin HEAD:milestone-6-analysis
