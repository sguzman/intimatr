name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Resolve package version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Could not resolve package version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version v$version"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Validate source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Build release DLL
        run: cargo build --locked --release --lib --target x86_64-pc-windows-msvc

      - name: Package distribution
        shell: pwsh
        run: |
          $zip = & ./scripts/package-release.ps1 -Version $env:PACKAGE_VERSION
          if (-not (Test-Path $zip -PathType Leaf)) {
            throw "Release archive was not produced: $zip"
          }
          & ./scripts/verify-release.ps1 -ArchivePath $zip -ExpectedVersion $env:PACKAGE_VERSION | Out-Null
          $name = [System.IO.Path]::GetFileNameWithoutExtension($zip)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = "$zip.sha256"
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -Path $sidecar -Encoding utf8
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          "RELEASE_SHA256=$sidecar" >> $env:GITHUB_ENV
          "RELEASE_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256 }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256 }}
          generate_release_notes: true
