name: Fix Milestone 6 Protocol Field

on:
  push:
    branches:
      - milestone-6-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rename colliding result payload
        shell: pwsh
        run: |
          $command = Get-Content src/command.rs -Raw
          $command = $command.Replace('Analysis {`n        result: crate::analysis::AnalysisResult,`n    },', 'Analysis {`n        analysis: crate::analysis::AnalysisResult,`n    },')
          $command = $command.Replace('CommandExecution::immediate(CommandResult::Analysis { result })', 'CommandExecution::immediate(CommandResult::Analysis { analysis: result })')
          Set-Content src/command.rs $command

          $test = Get-Content tests/analysis_command.rs -Raw
          $test = $test.Replace('CommandResult::Analysis { result } => result,', 'CommandResult::Analysis { analysis } => analysis,')
          Set-Content tests/analysis_command.rs $test
          cargo fmt --all
      - name: Commit clean fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/milestone6-protocol-fix.yml
          git add src/command.rs tests/analysis_command.rs
          git commit -m "fix analysis RPC result serialization"
          git push origin HEAD:milestone-6-analysis
