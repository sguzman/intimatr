name: Fix Debugger NTSTATUS

on:
  push:
    branches:
      - milestone-5-debugger

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply NTSTATUS type fix
        shell: pwsh
        run: |
          $path = 'src/debugger/windows.rs'
          $text = Get-Content -Raw $path
          $old = 'const EXCEPTION_SINGLE_STEP_CODE: u32 = 0x8000_0004;'
          $new = 'const EXCEPTION_SINGLE_STEP_CODE: i32 = 0x8000_0004_u32 as i32;'
          if (-not $text.Contains($old)) { throw 'single-step constant not found' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -NoNewline
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/debugger/windows.rs
          git commit -m "fix Windows single-step status type"
          git push origin HEAD:milestone-5-debugger
