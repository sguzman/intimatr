# Intimatr shared speed profile (proposed schema v1).
# Linux user configuration location is planned as:
# ~/.config/intimatr/intimatr.toml
#
# This sample can be parsed by src/speed_config.rs. The runtime has NOT yet
# wired it to Wine processes or Bottles game overrides.

version = 1

[speed]
enabled = false
initial_multiplier = 1.0
startup_duration_ms = 0
min_multiplier = 0.1
max_multiplier = 10.0
steps = [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0]

# Optional focused-game speed controls; no keys are captured by default.
# Uncomment the following as a set when focused-window delivery exists:
# [hotkeys]
# increase = "Ctrl+F7"
# decrease = "Ctrl+F6"
# toggle = "Alt+F7"
# reset = "Alt+F6"
# [hotkeys.hold]
# chord = "Ctrl+H"
# multiplier = 2.0
# duration_ms = 500
