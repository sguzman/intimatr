[target]
executable = "ExampleGame.exe"

[runtime]
command_workers = 4
command_queue_capacity = 64

[logging]
filter = "intimatr=trace"
directory = "logs"
file_name = "intimatr.log"
console = false

[rpc]
enabled = true
transport = "tcp"
bind = "127.0.0.1:31337"
pipe_name = "intimatr"
max_clients = 4
max_request_bytes = 1048576
max_response_bytes = 4194304
max_memory_transfer_bytes = 262144
max_scan_results_per_page = 4096

[scanner]
chunk_size_bytes = 1048576
worker_threads = 0
alignment = 1
max_results = 2000000
float_epsilon = 0.000001
require_readable = true
require_writable = false
require_executable = false
include_guard_pages = false

[debugger]
enabled = true
break_on_start = false
prefer_hardware_breakpoints = true
max_disassembly_bytes = 65536
max_disassembly_instructions = 512
max_hardware_breakpoints = 32
max_events_per_poll = 256
ui_enabled = true
ui_initially_visible = false
ui_always_on_top = false
ui_toggle_key = "F10"
ui_width = 1160.0
ui_height = 760.0
event_poll_ms = 100
disassembly_default_bytes = 256
disassembly_default_instructions = 64

[ui]
enabled = true
initially_visible = true
always_on_top = false
toggle_key = "Insert"
width = 1180.0
height = 760.0
watch_refresh_ms = 250
scan_page_size = 256

[policy]
allow_memory_read = true
allow_memory_write = true
allow_code_patch = false
allow_debugger = true
allow_remote_shutdown = false
